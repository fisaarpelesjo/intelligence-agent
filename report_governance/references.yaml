# A SEGUNDA referencia de cada indicador do diario — FR-1306 / SC-1305, fatia F2.
#
# Palavra dele no contrato de exemplos aprovado: cada indicador traz DUAS referencias,
# "anteontem E mesmo dia da semana passada, D-7". A primeira ja existe no relatorio desde o
# OD-31; esta declara a segunda.
#
# POR QUE A PALAVRA MORA AQUI E NAO NO PACOTE, que e a mesma razao dos rotulos da quebra:
# _every_word_is_his recusa todo token com letra que nao venha de um vocabulario nomeado, e
# "D-7" tem letra. A saida NAO e derrubar a palavra (foi o defeito do S-44, medido) nem
# crescer AUTHORED_WORDS -- esse orcamento conta o que o PACOTE guarda. Ela chega como DADO,
# do mesmo jeito que a ordem das secoes e os rotulos da quebra.
#
# A FORMA vem do contrato dele: "+4,2% vs D-7 (732)". O pacote monta a pontuacao e os
# numeros; as PALAVRAS sao estas duas.
#
# Se ele quiser outra palavra -- "semana passada" no lugar de "D-7", por exemplo -- muda aqui,
# datado, e nenhuma linha de codigo se mexe.
schema_version: 1
kind: report_references
decided_by: OD-113
decided_on: 2026-09-03

# Quantos dias atras fica a segunda referencia. SETE por ser o MESMO DIA DA SEMANA: a serie
# diaria e ruidosa e fim de semana nao se compara com terca-feira. Nao e preferencia -- e a
# razao pela qual o OD-14-E tinha escolhido semanas antes de ele pedir dias no OD-31.
days_back: 7

# Como a segunda referencia e nomeada na linha.
label: D-7

# A palavra que liga a variacao a referencia dela.
against: vs

# A palavra que diz que o numero entre parenteses e o ANTIGO -- OD-147, 2026-09-06.
#
# A linha fechava com "(654)": um numero pelado entre parenteses, no fim de uma linha que ja
# carregava outros tres. Palavra dele, do formato que ele escolheu sobre os proprios numeros:
#
#     vs D-7: +12,54 % (era 654)
#
# MORA AQUI, e nao no pacote, pela mesma razao que "D-7" e "vs": ela pertence a ESTA clausula, e
# a clausula inteira e dado. Se ele quiser outra palavra, muda aqui, datado, e nenhuma linha de
# codigo se mexe. Ausente, a referencia fecha com os parenteses pelados que sempre teve -- nunca
# com uma palavra que o pacote escolheu.
was: era
