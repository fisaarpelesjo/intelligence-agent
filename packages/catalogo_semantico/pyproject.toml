[project]
name = "catalogo-semantico"
version = "0.1.0"
description = "Decisao de autorizacao de acesso a metricas e dimensoes governadas."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalogo_semantico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
