[project]
name = "interacao-conversacional"
version = "0.1.0"
description = "Orquestra catalogo semantico e execucao de query para responder perguntas com provenencia ou abstencao."
requires-python = ">=3.12"
dependencies = [
  "catalogo-semantico",
  "execucao-query",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interacao_conversacional"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
catalogo-semantico = { workspace = true }
execucao-query = { workspace = true }
