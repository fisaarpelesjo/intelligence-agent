[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

# T001: the sixth additive sibling package. The five before it are never edited by
# this feature — `FR-008` of `specs/006-insights-and-prioritisation/spec.md`. `004`
# had one authorized upstream change; `005` had zero; this feature has zero.
#
# It is a separate package rather than a module of `005` because extending `005`
# would let a prioritisation concern reach into detection. `005` paid the same
# price for the same reason and the reasoning held.
#
# **AND THIS PACKAGE IS PLANNING MADE EXECUTABLE, NOT A DELIVERED CAPABILITY.**
# Its input does not exist yet: `005` cannot run against governed data, so there is
# not one candidate finding to prioritise. `spec.md` § 0 states that once and this
# file does not dilute it. Nothing here asserts readiness, delivered value or
# partial capability.
[project]
name = "proactive-distribution"
version = "0.1.0"
description = "Governed proactive distribution: saying it to the person who needs it, without being asked."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Pinned exactly, and **byte-matched** to the five existing packages rather than
# copied by eye. Six packages in one repository resolving the same library to
# different versions is a reproducibility defect.
#
# **Zero new runtime dependencies.** Composing declared components and ordering
# them needs no library: the arithmetic is `Decimal` comparison, and the ordering
# is a sort over values this package did not compute.
#
# `anomaly-investigation` is a path dependency within this monorepo and
# transitively supplies the rest. Bare names rather than `file://` URLs keep the
# file portable across checkouts.
dependencies = [
  "insights-prioritisation==0.1.0",
  "anomaly-investigation==0.1.0",
  "analytics-interaction==0.1.0",
  "analytics-query==0.1.0",
  "semantic-catalog==0.1.0",
  "pydantic==2.11.9",
  "PyYAML==6.0.2",
  # Canonical business time zone is America/Sao_Paulo, resolved through the IANA
  # database rather than a fixed offset. Windows ships no system tz database.
  # This package computes no date; it carries the reading instant a figure arrived
  # with (`FR-012`).
  "tzdata==2026.3",
]

# **Zero new dev dependencies.**
[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.0",
  "pyright==1.1.406",
  "hypothesis==6.140.3",
]

# No console script and no entry point. This feature is **callable and never
# self-starting** (`FR-007`). A console script would be the first step toward
# something that starts itself, and `tests/security/test_originates_nothing.py`
# measures the absence rather than trusting this comment.

[tool.hatch.build.targets.wheel]
packages = ["src/proactive_distribution"]

# --- linting, type checking, tests -------------------------------------------
# Mirrors `packages/anomaly_investigation/pyproject.toml`, which mirrors `004`'s,
# which mirrors `003`'s, `002`'s and `001`'s. Divergence between the six packages'
# gates would let a defect pass in one that the others would catch.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["proactive_distribution"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# The upstream packages are monorepo path dependencies installed editable. Pyright
# cannot follow the editable finder, so their source roots are named directly —
# otherwise every upstream type resolves as Unknown and strict mode reports
# hundreds of false errors that hide the real ones.
extraPaths = [
  "src",
  "../insights_prioritisation/src",
  "../anomaly_investigation/src",
  "../analytics_interaction/src",
  "../analytics_query/src",
  "../semantic_catalog/src",
]
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: validates an authored artifact or boundary against its contract",
  "unit: isolated deterministic unit test",
  "integration: exercises a run against real upstream seams",
  "adversarial: asserts a governed refusal against a hostile input",
  "security: measures a boundary rather than asserting it",
  "property: asserts an invariant over generated inputs",
]
