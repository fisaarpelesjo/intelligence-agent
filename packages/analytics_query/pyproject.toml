[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

# T001: the additive sibling package. `packages/semantic_catalog` is an upstream
# dependency and is never edited by this feature.
[project]
name = "analytics-query"
version = "0.1.0"
description = "Governed analytics query: bounded, read-only execution of catalog-permitted requests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Pinned exactly, and byte-matched to `001`'s — Constitution § Reproducibility
# requires pinned, reproducible dependencies, and two packages in one repository
# resolving the same library to different versions is a reproducibility defect.
#
# `semantic-catalog` is a **path dependency** within this monorepo: it is not
# published, so it is installed editable from `packages/semantic_catalog` before
# this package. Declaring the bare name rather than an absolute `file://` URL
# keeps the file portable across checkouts; the install order is what supplies it.
dependencies = [
  "semantic-catalog==0.1.0",
  "pydantic==2.11.9",
  "PyYAML==6.0.2",
  # Canonical business time zone is America/Sao_Paulo, resolved through the IANA
  # database rather than a fixed offset. Windows ships no system tz database, so
  # `zoneinfo` has nothing to read without this.
  "tzdata==2026.3",
  # The one new runtime dependency (ADR 0007), confined to `adapters/bigquery/`.
  # A contract test asserts that subpackage is the only importer, so the blast
  # radius of the dependency is a single module rather than the package.
  "google-cloud-bigquery==3.43.0",
]

# The dev extra exists from the first commit, deliberately. `001`'s
# readiness-guard workflow installed without it and its pytest step failed on a
# missing interpreter module rather than on anything it guarded.
[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.14.0",
  "pyright==1.1.406",
]

# The steward CLI arrives in Phase 10 (T101). `python -m analytics_query.cli`
# stays equivalent, and CI uses that form so it does not depend on install state.
# No console script is declared until the entry point exists.

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_query"]

# --- T002: linting, type checking, tests -------------------------------------
# Mirrors `packages/semantic_catalog/pyproject.toml`. Divergence between the two
# packages' gates would let a defect pass in one that the other would catch.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["analytics_query"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# `semantic-catalog` is a monorepo path dependency installed editable. Pyright
# cannot follow the editable finder, so its source root is named directly —
# otherwise every upstream type resolves as Unknown and strict mode reports
# hundreds of false errors that hide the real ones.
extraPaths = ["src", "../semantic_catalog/src"]
# `google.cloud` is a namespace package; without the interpreter named
# explicitly Pyright resolves the import but not the types behind it.
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: validates an authored artifact or boundary against its contract",
  "unit: isolated deterministic unit test",
  "integration: exercises the ordered request pipeline",
  "adversarial: asserts a governed refusal against a hostile input",
]
