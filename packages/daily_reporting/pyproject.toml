[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

# The eighth additive sibling package. The seven before it are never edited by this
# feature, which is the rule every package since `004` has kept.
#
# It is a separate package rather than a module of `007` because `007` distributes a
# PRIORITISABLE FINDING and this feature distributes neither — it produces a daily
# summary and a rule alert, which `ADR 0035` excludes from its own scope by name.
# Folding them together would put two authorities in one namespace, and a reader
# asking *may this go out?* would no longer have one record to consult.
#
# **AND PHASE E IS NOT IN HERE.** Nothing in this package sends anything, enables a
# channel, or writes a readiness record. The computing spine is buildable without any
# of that, and building it first is what keeps the send from being written by whatever
# code happened to be closest.
[project]
name = "daily-reporting"
version = "0.1.0"
description = "The daily KPI report and the rule alert: what the numbers are, and when one of them moved."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Pinned exactly, and **byte-matched** to the seven existing packages rather than
# copied by eye. Eight packages in one repository resolving the same library to
# different versions is a reproducibility defect.
#
# **Zero new runtime dependencies.** A percentile over a series needs no library:
# it is a sort and a linear interpolation over `Decimal`, and pulling in a numeric
# stack to avoid twelve lines would put float arithmetic under a governed threshold.
#
# `proactive-distribution` is a path dependency within this monorepo and transitively
# supplies the rest. It is depended on for ONE reason — this package's refusal codes
# must be proved disjoint from all seven namespaces, and a namespace that cannot be
# imported cannot be intersected with.
dependencies = [
  "proactive-distribution==0.1.0",
  "insights-prioritisation==0.1.0",
  "anomaly-investigation==0.1.0",
  "analytics-interaction==0.1.0",
  "analytics-query==0.1.0",
  "channel-integration==0.1.0",
  "semantic-catalog==0.1.0",
  "pydantic==2.11.9",
  "PyYAML==6.0.2",
  # Canonical business time zone is America/Sao_Paulo, resolved through the IANA
  # database rather than a fixed offset. Windows ships no system tz database. This
  # package decides which day is CLOSED, and a day boundary read from a fixed offset
  # is wrong twice a year.
  "tzdata==2026.3",
]

# **Zero new dev dependencies.**
[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.0",
  "pyright==1.1.406",
  "hypothesis==6.140.3",
]

# No console script and no entry point. A run is CALLED and receives its instant as a
# parameter — `FR-823`. A console script would be the first step toward something that
# starts itself, and `tests/security/test_originates_nothing.py` measures the absence
# rather than trusting this comment.

[tool.hatch.build.targets.wheel]
packages = ["src/daily_reporting"]

# --- linting, type checking, tests -------------------------------------------
# Mirrors `packages/proactive_distribution/pyproject.toml`, which mirrors the six
# before it. Divergence between the eight packages' gates would let a defect pass in
# one that the others would catch.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["daily_reporting"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# The upstream packages are monorepo path dependencies installed editable. Pyright
# cannot follow the editable finder, so their source roots are named directly —
# otherwise every upstream type resolves as Unknown and strict mode reports hundreds
# of false errors that hide the real ones.
extraPaths = [
  "src",
  "../proactive_distribution/src",
  "../insights_prioritisation/src",
  "../anomaly_investigation/src",
  "../analytics_interaction/src",
  "../analytics_query/src",
  "../channel_integration/src",
  "../semantic_catalog/src",
]
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: validates an authored artifact or boundary against its contract",
  "unit: isolated deterministic unit test",
  "integration: exercises a run against real upstream seams",
  "adversarial: asserts a governed refusal against a hostile input",
  "security: measures a boundary rather than asserting it",
  "property: asserts an invariant over generated inputs",
]
