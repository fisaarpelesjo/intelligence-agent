[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

# T1101: the seventh additive sibling package. The six before it are never edited by
# this feature; crossings, when they happen, are declared by full sha with exact reach.
#
# It is a separate package rather than a module of `analytics_interaction` because
# `003:FR-082`'s prohibitions forbid the conversation store from ever owning raw
# question text, free-text replies, metric values or filter values — and bolting the
# memory inside that package would put the forbidden material one import away from
# the store that must never own it.
#
# **AND THIS PACKAGE PREPARES MEMORY, NOT A CONVERSATION.** Inbound stays off
# (`OD-20`: RECEBE []); nothing here receives a message, and turning that on is a
# decision with an owner, not an implication of this package existing.
[project]
name = "conversation-context"
version = "0.1.0"
description = "Governed conversational memory: an owner, a scope and an expiry — never raw text."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Zero runtime dependencies. The envelope, the three-state read and the file backend
# are stdlib; the seam it implements against (`003:FR-081`) is a Protocol.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conversation_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: nodes that pin the feature's promises",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
