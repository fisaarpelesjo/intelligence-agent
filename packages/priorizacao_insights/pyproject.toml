[project]
name = "priorizacao-insights"
version = "0.1.0"
description = "Ordena insights por magnitude x confianca e alcance x confianca, termo a termo."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priorizacao_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
