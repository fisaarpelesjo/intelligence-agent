[project]
name = "deteccao-anomalia"
version = "0.1.0"
description = "Deteccao de candidate finding via baseline de media movel e limiar percentual."
requires-python = ">=3.12"
dependencies = [
  "catalogo-semantico",
  "execucao-query",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deteccao_anomalia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
catalogo-semantico = { workspace = true }
execucao-query = { workspace = true }
