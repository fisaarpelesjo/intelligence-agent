[project]
name = "relatorio-periodico"
version = "0.1.0"
description = "Relatorio diario de KPIs e avaliacao independente de alerta por limiar."
requires-python = ">=3.12"
dependencies = [
  "catalogo-semantico",
  "execucao-query",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relatorio_periodico"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
catalogo-semantico = { workspace = true }
execucao-query = { workspace = true }
