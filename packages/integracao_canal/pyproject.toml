[project]
name = "integracao-canal"
version = "0.1.0"
description = "Resolucao de identidade e planejamento de entrega respeitando a capacidade do canal."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integracao_canal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
