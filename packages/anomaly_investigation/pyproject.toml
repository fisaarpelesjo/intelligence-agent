[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

# T005: the fifth additive sibling package. `packages/semantic_catalog`,
# `packages/analytics_query`, `packages/analytics_interaction` and
# `packages/channel_integration` are never edited by this feature — `FR-008`, and
# standing constraint 1 of tasks.md. This feature has **zero** authorized upstream
# changes, where `004` had one.
#
# It is a separate package rather than a module of `004` because that is measured,
# not preferred: `test_reactive_only.py` walks `channel_integration`'s syntax tree
# and refuses every scheduler and notify primitive, so detection could not live
# there without either breaking that node or pretending to be a channel concern.
[project]
name = "anomaly-investigation"
version = "0.1.0"
description = "Governed anomaly detection and investigation: what deserves attention when nobody asked."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Pinned exactly, and byte-matched to `001`'s, `002`'s, `003`'s and `004`'s.
# Constitution § Reproducibility requires pinned dependencies, and five packages in
# one repository resolving the same library to different versions is a
# reproducibility defect.
#
# **Zero new runtime dependencies**, and the reason is the baseline's own ordering:
# `robust_statistics` is its *second* detection level and `time_series_models` its
# third, which `enabled: false` closes. This feature implements the **first** —
# `business_rules`, which the baseline declares `priority: first` — and a threshold
# comparison over exact decimals needs no library.
#
# `analytics-interaction` is a path dependency within this monorepo and transitively
# supplies `analytics-query` and `semantic-catalog`. Bare names rather than
# `file://` URLs keep the file portable across checkouts.
dependencies = [
  "analytics-interaction==0.1.0",
  "analytics-query==0.1.0",
  "semantic-catalog==0.1.0",
  "pydantic==2.11.9",
  "PyYAML==6.0.2",
  # Canonical business time zone is America/Sao_Paulo, resolved through the IANA
  # database rather than a fixed offset. Windows ships no system tz database.
  # This package computes no date (`FR-012`); it reads windows that carry one.
  "tzdata==2026.3",
]

# **Zero new dev dependencies.** `hypothesis` is already `003`'s and `004`'s pin.
[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.0",
  "pyright==1.1.406",
  "hypothesis==6.140.3",
]

# No console script and no entry point. This feature is **callable and never
# self-starting** (`FR-007`): whatever calls a run passes it the instant. A
# console script would be the first step toward something that starts itself.

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_investigation"]

# --- linting, type checking, tests -------------------------------------------
# Mirrors `packages/channel_integration/pyproject.toml`, which mirrors `003`'s,
# which mirrors `002`'s, which mirrors `001`'s. Divergence between the five
# packages' gates would let a defect pass in one that the others would catch.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["anomaly_investigation"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# The upstream packages are monorepo path dependencies installed editable. Pyright
# cannot follow the editable finder, so their source roots are named directly —
# otherwise every upstream type resolves as Unknown and strict mode reports
# hundreds of false errors that hide the real ones.
extraPaths = [
  "src",
  "../analytics_interaction/src",
  "../analytics_query/src",
  "../semantic_catalog/src",
]
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: validates an authored artifact or boundary against its contract",
  "unit: isolated deterministic unit test",
  "integration: exercises a run against real upstream seams",
  "adversarial: asserts a governed refusal against a hostile input",
  "security: measures a boundary rather than asserting it",
  "property: asserts an invariant over generated inputs",
]
