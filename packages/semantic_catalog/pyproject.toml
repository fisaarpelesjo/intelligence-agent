[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "semantic-catalog"
version = "0.1.0"
description = "Governed semantic catalog: metric, dimension, source and grain contracts with deny-by-default validation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Pinned exactly — Constitution § Reproducibility requires pinned, reproducible dependencies.
dependencies = [
  "pydantic==2.11.9",
  "PyYAML==6.0.2",
  # The canonical business time zone is America/Sao_Paulo and research §R-10
  # requires the IANA database rather than a fixed offset, because the zone
  # observed daylight saving before 2019. Windows ships no system tz database,
  # so `zoneinfo` has nothing to read without this. Pinning it also pins the
  # tz rules, which keeps historical period arithmetic reproducible.
  "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.0",
  "pyright==1.1.406",
  # `test_the_declared_direction_matches_the_source` asks the view whether contract and source
  # still agree on polarity. The query is credential-gated and skips without one, but pyright
  # reads the body regardless -- so an undeclared import here is seventeen red `catalog` runs
  # (2026-09-04 to 2026-09-06) reporting `"bigquery" is unknown import symbol` plus six cascade
  # errors. Declared as `dev` and not runtime because nothing under `src/` imports it.
  # Same pin as `packages/analytics_query`, deliberately: two pins for one distribution is a
  # disagreement waiting to be resolved by whichever install happens to run last.
  "google-cloud-bigquery==3.43.0",
]

# T096: the steward CLI. SC-011 requires a steward to validate locally with no
# engineering change, which means the command has to be installed, not invoked
# through a path they have to remember. `python -m semantic_catalog.cli` stays
# equivalent, and CI uses that form so it does not depend on install state.
[project.scripts]
catalog = "semantic_catalog.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_catalog"]

# --- T002: linting, type checking, tests -------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["semantic_catalog"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: validates an authored artifact against its schema",
  "unit: isolated deterministic unit test",
  "integration: exercises the full gate pipeline",
]
