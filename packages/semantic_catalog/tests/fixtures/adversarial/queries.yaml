# T099 adversarial pt-BR queries — UNIT FIXTURES ONLY.
#
# Informal phrasing and misspellings a real steward or analyst would type. The
# catalog must resolve to the English canonical identifier or refuse cleanly —
# it must never resolve silently to one of several plausible matches (FR-016).
#
# NOT a benchmark corpus. D-11 (T107) is the governed corpus drawn from real
# user phrasing, and SC-002 synonym quality cannot be measured or claimed from
# these hand-written cases.

cases:
  - id: exact_canonical_identifier
    query: app_sessions
    expect: resolved
    metric: app_sessions

  - id: authored_pt_br_label
    query: Sessoes do aplicativo
    expect: resolved
    metric: app_sessions

  - id: nonsense_resolves_to_nothing
    query: xyzzy_nao_existe
    expect: not_governed

  - id: empty_query_resolves_to_nothing
    query: "   "
    expect: not_governed
