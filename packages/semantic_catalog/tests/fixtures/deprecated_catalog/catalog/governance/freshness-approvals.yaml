# T090 fixture — NOT production data, NOT a production approval.
#
# A self-contained miniature catalog whose source IS approved, so the gate
# pipeline is reachable at all. The production catalog is deliberately
# unpublishable while D-1 and D-8 are open; faking an approval there would be
# inventing governance history.

# Fixture approval. It exists so the pipeline is reachable at all, and it grants
# nothing in the production catalog.
catalog_schema_version: 1
kind: freshness_approvals
approvals:
  - source_id: fixture_source
    approval_status: approved
    expected_refresh_interval: P1D
    delay_tolerance: P1D
    reporting_time_zone: America/Sao_Paulo
    earliest_available_date: 2026-01-01
    approved_by_role: fixture_governance
    approved_at: 2026-01-02
    source_commit: fixture0
