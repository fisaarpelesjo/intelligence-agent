# T090 fixture — NOT production data, NOT a production approval.
#
# A self-contained miniature catalog whose source IS approved, so the gate
# pipeline is reachable at all. The production catalog is deliberately
# unpublishable while D-1 and D-8 are open; faking an approval there would be
# inventing governance history.

# Deprecated from 2026-06-01 with an authored replacement. No continuation
# version exists, so periods on or after the boundary have no governed
# definition and are refused (FR-062). The replacement is disclosed as guidance
# and never substituted (FR-064).

catalog_schema_version: 1
kind: metric
name: fixture_metric
owner: fixture_owner
access: standard
grain_family: day
versions:
  - version: 1
    effective_from: 2026-01-01
    source_view: semantic.fixture_daily
    grain: date x product
    aggregation: sum
    additivity: additive
    unit: sessions
    time_dimension: date
    calculation_basis: Sessoes iniciadas no dia.
    content:
      lang: pt-BR
      label: Sessoes do aplicativo
      description: Sessoes iniciadas no dia.
deprecation:
  deprecated_from: 2026-06-01
  successor: fixture_replacement
  replacement_metric_id: fixture_replacement
source_availability:
  - source: fixture_source
    status: available
    available_from: 2026-01-01
    effective_from: 2026-01-01
