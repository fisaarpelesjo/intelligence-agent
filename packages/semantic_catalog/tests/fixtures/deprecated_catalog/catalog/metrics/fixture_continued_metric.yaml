# T090 fixture — NOT production data, NOT a production approval.
#
# A self-contained miniature catalog whose source IS approved, so the gate
# pipeline is reachable at all. The production catalog is deliberately
# unpublishable while D-1 and D-8 are open; faking an approval there would be
# inventing governance history.

# Deprecated from 2026-06-01 AND carrying an authored continuation version that
# opens on the boundary. FR-062 permits the post-boundary period here, because
# somebody governed it deliberately rather than the catalog inferring one.

catalog_schema_version: 1
kind: metric
name: fixture_continued_metric
owner: fixture_owner
access: standard
grain_family: day
versions:
  - version: 1
    effective_from: 2026-01-01
    effective_to: 2026-05-31
    source_view: semantic.fixture_daily
    grain: date x product
    aggregation: sum
    additivity: additive
    unit: events
    time_dimension: date
    calculation_basis: Eventos registrados no dia.
    content:
      lang: pt-BR
      label: Eventos continuados
      description: Eventos registrados no dia.

  - version: 2
    effective_from: 2026-06-01
    source_view: semantic.fixture_daily
    grain: date x product
    aggregation: sum
    additivity: additive
    unit: events
    time_dimension: date
    calculation_basis: Eventos registrados no dia, definicao de continuidade.
    content:
      lang: pt-BR
      label: Eventos continuados
      description: Eventos registrados no dia sob a definicao de continuidade.
deprecation:
  deprecated_from: 2026-06-01
source_availability:
  - source: fixture_source
    status: available
    available_from: 2026-01-01
    effective_from: 2026-01-01
