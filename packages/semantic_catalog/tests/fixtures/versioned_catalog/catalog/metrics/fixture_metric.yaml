# T090 fixture — NOT production data, NOT a production approval.
#
# A self-contained miniature catalog whose source IS approved, so the gate
# pipeline is reachable at all. The production catalog is deliberately
# unpublishable while D-1 and D-8 are open; faking an approval there would be
# inventing governance history.

# Three definitions, contiguous and non-overlapping. A request for June 2025
# resolves to @1, for August to @2, for November to @3, and a range crossing any
# boundary comes back segmented rather than blended (FR-034, FR-035).

catalog_schema_version: 1
kind: metric
name: fixture_metric
owner: fixture_owner
access: standard
grain_family: day
versions:
  - version: 1
    effective_from: 2025-01-01
    effective_to: 2025-06-30
    source_view: semantic.fixture_daily
    grain: date x product
    aggregation: sum
    additivity: additive
    unit: sessions
    time_dimension: date
    calculation_basis: Sessoes iniciadas no dia, contagem bruta.
    content:
      lang: pt-BR
      label: Sessoes do aplicativo
      description: Sessoes iniciadas no dia, contagem bruta.

  - version: 2
    effective_from: 2025-07-01
    effective_to: 2025-09-30
    source_view: semantic.fixture_daily
    grain: date x product
    aggregation: sum
    additivity: additive
    unit: sessions
    time_dimension: date
    calculation_basis: Sessoes iniciadas no dia, excluindo sessoes de teste.
    exclusions:
      - Sessoes originadas de contas internas de teste.
    content:
      lang: pt-BR
      label: Sessoes do aplicativo
      description: Sessoes iniciadas no dia, sem contas internas.

  - version: 3
    effective_from: 2025-10-01
    source_view: semantic.fixture_daily
    grain: date x product
    aggregation: count_distinct
    additivity: non_additive
    unit: sessions
    time_dimension: date
    calculation_basis: Sessoes distintas iniciadas no dia, sem contas internas.
    exclusions:
      - Sessoes originadas de contas internas de teste.
    content:
      lang: pt-BR
      label: Sessoes do aplicativo
      description: Sessoes distintas iniciadas no dia.
source_availability:
  - source: fixture_source
    status: available
    available_from: 2025-01-01
    effective_from: 2025-01-01
