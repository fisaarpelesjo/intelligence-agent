# T090 fixture — NOT production data, NOT a production approval.
#
# A self-contained miniature catalog whose source IS approved, so the gate
# pipeline is reachable at all. The production catalog is deliberately
# unpublishable while D-1 and D-8 are open; faking an approval there would be
# inventing governance history.

# Only the codes these fixtures reach. The production registry (T038) covers all
# forty-one and is validated separately; duplicating it here would create a
# second place for wording to drift.

catalog_schema_version: 1
kind: reason_messages
lang: pt-BR

messages:
  - reason_code: REQUEST_ALLOWED
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    message: Solicitacao autorizada pelas politicas vigentes.

  - reason_code: SPANS_DEFINITION_CHANGE
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id, metric_version_id]
    message: >-
      O periodo pedido atravessa uma mudanca de definicao de {metric_id}. A
      partir de {metric_version_id} a metrica passou a ser calculada de outra
      forma.

  - reason_code: DEPRECATED_METRIC
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id]
    message: >-
      A metrica {metric_id} esta descontinuada. Ela continua resolvivel para
      periodos historicos, e nenhuma substituta e usada automaticamente.

  - reason_code: METRIC_DEPRECATED_FOR_PERIOD
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id, period_end]
    message: >-
      {metric_id} ja estava descontinuada em {period_end}; nao ha definicao
      vigente para esse periodo.

  - reason_code: SPANS_DEPRECATION_BOUNDARY
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id]
    message: >-
      O periodo pedido atravessa a descontinuacao de {metric_id}: parte dele
      esta sob a definicao antiga e parte nao tem definicao vigente.

  - reason_code: COMPARISON_REQUIRES_DEPRECATED_PERIOD
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id]
    message: >-
      A comparacao exigiria um periodo em que {metric_id} ja estava
      descontinuada.

  - reason_code: RELEASE_WITHDRAWN
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [catalog_release_id]
    message: >-
      A versao de catalogo {catalog_release_id} foi retirada e nao responde a
      novas solicitacoes. Decisoes ja emitidas continuam resolviveis.

  - reason_code: METRIC_NOT_GOVERNED
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id]
    message: Nao existe metrica governada chamada {metric_id}.

  - reason_code: DIMENSION_NOT_GOVERNED
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [dimension_id]
    message: Nao existe dimensao governada chamada {dimension_id}.

  - reason_code: SOURCE_NOT_GOVERNED
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [source_id]
    message: Nao existe fonte governada chamada {source_id}.

  - reason_code: METRIC_PENDING
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id, owner]
    message: A metrica {metric_id} esta pendente. Procure {owner}.

  - reason_code: ACCESS_DENIED
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id]
    message: Voce nao tem autorizacao para consultar {metric_id}.

  - reason_code: ACCESS_TAG_UNKNOWN
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [access_tag]
    message: A etiqueta de acesso {access_tag} nao esta no registro.

  - reason_code: METRIC_NOT_AVAILABLE_FOR_SOURCE
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id, source_id]
    message: A metrica {metric_id} nao esta disponivel para a fonte {source_id}.

  - reason_code: COMPARABILITY_RULE_MISSING
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    message: >-
      Nao existe regra de comparabilidade aprovada para esse par. A ausencia de
      regra e recusa, nao permissao.

  - reason_code: RANGE_OUTSIDE_COVERAGE
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [metric_id]
    message: O periodo pedido esta fora da cobertura de {metric_id}.

  - reason_code: COVERAGE_ENDS_BEFORE_PERIOD
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [source_id]
    message: A cobertura de {source_id} termina antes do fim do periodo pedido.

  - reason_code: SOURCE_STATE_UNKNOWN
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    message: O estado de atualizacao de uma fonte exigida e desconhecido.

  - reason_code: SOURCE_BEYOND_TOLERANCE
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    interpolation_fields: [source_id, last_successful_update, delay_tolerance]
    message: >-
      A fonte {source_id} foi atualizada em {last_successful_update}, acima da
      tolerancia de {delay_tolerance}.

  - reason_code: PERIOD_INCOMPLETE
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    message: O periodo pedido ainda nao terminou.

  - reason_code: POLICY_UNRESOLVABLE
    version: 1
    effective_from: 2025-01-01
    owner_role: fixture_governance
    reviewed_by_role: fixture_owner
    message: Nao foi possivel determinar qual politica de catalogo esta vigente.
