# Curated decision matrix — T058 (FR-011, FR-012; quickstart Scenario 4).
#
# Reviewer-auditable: every row states the request, the expected outcome AND the
# expected stable reason code, and — where a denial must name an offender — the
# subject it must name. A row asserting only "DENY" would pass on a generic
# refusal, which is exactly what SC-004 forbids.
#
# Evaluated against `catalog/`, a self-contained fixture whose sources ARE
# approved. The production catalog is unpublishable by design while D-1 and D-8
# are open, so gates 4 and 5 are unreachable there; nothing here grants anything
# in production.
#
# `access` is what the requester holds. `scope` is the authorisation scope.
# `freshness` names a fixture in `tests/fixtures/freshness/`, which is the
# observed external state the caller supplies. A row with none supplies no
# evidence, and the coverage and freshness gates refuse — an unobserved state is
# unknown, never healthy. Rows that deny before Gate 7 need none.

principal_type: user

rows:
  # --- Gate 1: existence ---------------------------------------------------
  - id: unknown_metric_denies
    why: The concept does not exist here; the reader should not be sent to an owner.
    metrics: [nao_existe]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: METRIC_NOT_GOVERNED, subject_kind: metric, subject_id: nao_existe}

  - id: unknown_dimension_denies
    metrics: [app_sessions]
    dimensions: [nao_existe]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: DIMENSION_NOT_GOVERNED, subject_kind: dimension, subject_id: nao_existe}

  - id: unknown_source_denies
    metrics: [app_sessions]
    sources: [nao_existe]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: SOURCE_NOT_GOVERNED, subject_kind: source, subject_id: nao_existe}

  # --- Gate 3: authorisation, BEFORE combination ---------------------------
  - id: unheld_tag_denies_on_authorisation
    why: >-
      The requester holds nothing. Gate 3 refuses before Gate 4 can report that
      the metric has dimensions, which would disclose its shape.
    metrics: [app_sessions]
    sources: [app_a]
    access: []
    scope: default
    expect: {outcome: DENY, reason_code: ACCESS_DENIED, subject_kind: metric, subject_id: app_sessions}

  - id: restricted_metric_denies_before_combination
    why: >-
      An INVALID combination on a metric the requester may not see must still
      refuse on authorisation. If this row ever reports a combination code, the
      gate order has regressed and refusals are leaking metric shape.
    metrics: [restricted_metric]
    dimensions: [app_version]
    sources: [store_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: ACCESS_TAG_SCOPE_MISMATCH, subject_kind: access_tag, subject_id: restricted}

  - id: deprecated_tag_denies_and_replacement_is_not_granted
    why: Inheriting authorisation from a retired tag is how stale access survives a cleanup.
    metrics: [retired_metric]
    sources: [app_a]
    access: [retired_tag]
    scope: default
    expect: {outcome: DENY, reason_code: ACCESS_TAG_DEPRECATED, subject_kind: access_tag, subject_id: retired_tag}

  # --- Gate 4: combination -------------------------------------------------
  - id: metric_not_available_for_source
    why: Store downloads are not a product-telemetry event.
    metrics: [store_downloads]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: METRIC_NOT_AVAILABLE_FOR_SOURCE, subject_kind: metric, subject_id: store_downloads}

  - id: dimension_not_applicable_to_source
    why: The store does not record an app version at all — absence means not applicable.
    metrics: [store_downloads]
    dimensions: [app_version]
    sources: [store_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: DIMENSION_NOT_APPLICABLE_TO_SOURCE, subject_kind: dimension, subject_id: app_version}

  - id: dimension_not_allowed_for_metric
    why: >-
      The source records app_version and the dimension is governed, but this
      metric's contract does not permit slicing by it. Deny-by-default.
    metrics: [cohort_retention]
    dimensions: [app_version]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: DIMENSION_NOT_ALLOWED_FOR_METRIC, subject_kind: dimension, subject_id: app_version}

  # --- Gate 5: grain family and additivity ---------------------------------
  - id: mixed_grain_families_deny
    why: A cohort-grained and a day-grained metric on one row have no common referent.
    metrics: [cohort_retention, app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: GRAIN_FAMILY_MISMATCH, subject_kind: request}

  - id: summing_a_point_in_time_metric_denies
    why: Summing a snapshot rating produces a number nobody has ever seen.
    metrics: [store_rating]
    sources: [store_a]
    aggregate: sum
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: AGGREGATION_INVALID_FOR_ADDITIVITY, subject_kind: metric, subject_id: store_rating}

  - id: summing_a_ratio_denies
    metrics: [cohort_retention]
    sources: [app_a]
    aggregate: sum
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: AGGREGATION_INVALID_FOR_ADDITIVITY, subject_kind: metric, subject_id: cohort_retention}

  # --- Gate 6: comparability is deny-by-default ----------------------------
  - id: non_combinable_pair_denies_with_its_business_reason
    why: >-
      Sessions are recorded on the device and downloads are reported by the
      store. Near-synonyms in conversation, different events in the data.
    freshness: complete.yaml
    metrics: [app_sessions, store_downloads]
    sources: [app_a, store_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: METRICS_NOT_COMPARABLE, subject_kind: request}

  - id: reversed_operands_reach_the_same_rule
    why: A rule relating A to B governs the request naming B and A.
    freshness: complete.yaml
    metrics: [store_downloads, app_sessions]
    sources: [store_a, app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: METRICS_NOT_COMPARABLE, subject_kind: request}

  - id: a_pair_with_no_rule_denies
    why: >-
      Both day-grained, both counted the same way, sharing a source — and still
      refused. Absence of a rule is not permission.
    freshness: complete.yaml
    metrics: [app_sessions, cross_source_metric]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: COMPARABILITY_RULE_MISSING, subject_kind: request}

  - id: caveated_pair_allows_with_the_declared_caveat
    why: US4 scenario 3 — permitted, and labelled with the authored wording.
    freshness: complete.yaml
    metrics: [app_sessions, store_rating]
    sources: [app_a, store_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW_WITH_CAVEAT, reason_code: COMPARABLE_WITH_CAVEAT, subject_kind: request}

  - id: unauthorised_incomparable_pair_denies_on_authorisation
    why: >-
      Gate 3 before Gate 6. A refusal must not reveal that two metrics the
      requester may not see are related at all.
    freshness: complete.yaml
    metrics: [app_sessions, store_downloads]
    sources: [app_a, store_a]
    access: []
    scope: default
    expect: {outcome: DENY, reason_code: ACCESS_DENIED, subject_kind: metric, subject_id: app_sessions}

  # --- Gate 2: deprecation is dated ----------------------------------------
  # `deprecated_metric` is deprecated from 2026-07-15 and has no governed
  # continuation version. Four rows, one per position relative to that
  # boundary, because a single shared window could only assert one of them.
  - id: deprecated_metric_allows_with_caveat
    freshness: complete.yaml
    from: 2026-07-01
    to: 2026-07-14
    why: >-
      Entirely before the boundary. DEPRECATED_METRIC is ALLOW_WITH_CAVEAT, so
      the metric passes and the decision says it is retired. Denying would turn
      a caveat into a refusal; passing silently would present a retired metric
      as an unqualified allow.
    metrics: [deprecated_metric]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW_WITH_CAVEAT, reason_code: DEPRECATED_METRIC, subject_kind: metric, subject_id: deprecated_metric}

  - id: day_before_the_boundary_is_still_answerable
    freshness: complete.yaml
    from: 2026-07-14
    to: 2026-07-14
    why: The boundary is inclusive on the deprecation side, so the day before it is not.
    metrics: [deprecated_metric]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW_WITH_CAVEAT, reason_code: DEPRECATED_METRIC, subject_kind: metric, subject_id: deprecated_metric}

  - id: boundary_day_is_already_deprecated
    freshness: complete.yaml
    from: 2026-07-15
    to: 2026-07-15
    why: >-
      `deprecated_from` is the first deprecated day, not the last live one. An
      off-by-one here answers a day that has no governed definition (FR-062).
    metrics: [deprecated_metric]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: METRIC_DEPRECATED_FOR_PERIOD, subject_kind: metric, subject_id: deprecated_metric}

  - id: post_boundary_period_denies
    freshness: complete.yaml
    from: 2026-07-16
    to: 2026-07-31
    why: >-
      No governed continuation version exists, so the period has no definition
      and is refused. The catalog does not redirect to a replacement (FR-062).
    metrics: [deprecated_metric]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: METRIC_DEPRECATED_FOR_PERIOD, subject_kind: metric, subject_id: deprecated_metric}

  - id: range_crossing_the_boundary_is_segmented
    freshness: complete.yaml
    from: 2026-07-01
    to: 2026-07-31
    why: >-
      Segmented rather than silently shortened to the half that still has a
      definition (FR-063). The post-boundary span comes back as an explicit
      unavailable limitation.
    metrics: [deprecated_metric]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW_WITH_CAVEAT, reason_code: SPANS_DEPRECATION_BOUNDARY, subject_kind: metric, subject_id: deprecated_metric}

  - id: deprecated_and_unauthorised_denies_on_authorisation
    why: The denial wins. A caveat raised earlier must not survive into an unauthorised answer.
    metrics: [deprecated_metric]
    sources: [app_a]
    access: []
    scope: default
    expect: {outcome: DENY, reason_code: ACCESS_DENIED, subject_kind: metric, subject_id: deprecated_metric}

  - id: deprecated_and_invalid_combination_denies_on_combination
    why: A later gate's denial overrides the earlier caveat.
    metrics: [deprecated_metric]
    sources: [store_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: METRIC_NOT_AVAILABLE_FOR_SOURCE, subject_kind: metric, subject_id: deprecated_metric}

  # --- Gates 7 to 9: coverage, freshness and period ------------------------
  - id: no_snapshot_denies_as_unknown
    why: >-
      The caller supplied no observed state. Unknown is refused, never read as
      healthy — the same rule that governs an unreported source.
    metrics: [app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: SOURCE_STATE_UNKNOWN, subject_kind: request}

  - id: partial_source_denies_even_within_tolerance
    why: >-
      FR-070. Lag says WHEN the load ran; completeness says HOW MUCH arrived. A
      punctual half-loaded source is the shortest route to a confidently wrong
      number, because nothing about it looks late.
    freshness: partial_within_tolerance.yaml
    metrics: [store_downloads]
    sources: [store_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: SOURCE_STATE_PARTIAL, subject_kind: source, subject_id: store_a}

  - id: coverage_ending_early_denies_even_when_punctual
    why: FR-071. Being on time does not manufacture the missing days.
    freshness: long_tolerance_short_coverage.yaml
    metrics: [store_downloads]
    sources: [store_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: COVERAGE_ENDS_BEFORE_PERIOD, subject_kind: source, subject_id: store_a}

  - id: stale_required_source_denies_the_request_as_asked
    freshness: beyond_tolerance.yaml
    metrics: [app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: SOURCE_BEYOND_TOLERANCE, subject_kind: source, subject_id: app_a}

  - id: failed_source_denies
    freshness: failed.yaml
    metrics: [app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: SOURCE_STATE_FAILED, subject_kind: source, subject_id: app_a}

  - id: unknown_source_state_denies
    freshness: unknown.yaml
    metrics: [app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: SOURCE_STATE_UNKNOWN, subject_kind: source, subject_id: app_a}

  - id: lagging_within_tolerance_allows_with_caveat
    why: Late but inside tolerance. Answers, with the lag stated.
    freshness: lagging_within_tolerance.yaml
    metrics: [app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW_WITH_CAVEAT, reason_code: SOURCE_LAGGING_WITHIN_TOLERANCE, subject_kind: source, subject_id: app_a}

  - id: no_observed_coverage_row_denies
    why: Silence in the availability table is not coverage.
    freshness: no_coverage_row.yaml
    metrics: [app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: RANGE_OUTSIDE_COVERAGE, subject_kind: metric, subject_id: app_sessions}

  - id: coverage_entirely_outside_the_period_denies
    freshness: outside_coverage.yaml
    metrics: [app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: RANGE_OUTSIDE_COVERAGE, subject_kind: metric, subject_id: app_sessions}

  - id: a_named_but_unused_source_does_not_gate_the_outcome
    why: >-
      Scenario 6c. `store_downloads` is a store metric, so the stale app source
      contributes nothing and is not required. Its lag is never evaluated.
    freshness: android_beyond_tolerance.yaml
    metrics: [store_downloads]
    sources: [store_a, app_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW_WITH_CAVEAT, reason_code: TIMEZONE_OFFSET_MATERIAL, subject_kind: source, subject_id: store_a}

  - id: healthy_sources_remain_independently_analysable
    why: >-
      Scenario 6b. The same snapshot carries a stale store, but this request does
      not need it. Refusal is per evaluation, never a source quarantine.
    freshness: website_beyond_tolerance.yaml
    metrics: [app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW, reason_code: REQUEST_ALLOWED, subject_kind: request}

  - id: one_stale_source_denies_the_whole_cross_source_request
    why: >-
      Scenario 6a. The request as asked is denied. The healthy remainder may be
      DISCLOSED, and disclosure is not a result.
    freshness: one_source_beyond_tolerance.yaml
    metrics: [cross_source_metric]
    sources: [app_a, store_a]
    access: [standard]
    scope: default
    expect: {outcome: DENY, reason_code: SOURCE_BEYOND_TOLERANCE, subject_kind: source, subject_id: store_a}
    answerable_subset: [app_a]

  # --- Valid combinations --------------------------------------------------
  - id: valid_metric_source_pair_allows
    freshness: complete.yaml
    why: US2 scenario 4 — approval states the contract the analysis must honour.
    metrics: [app_sessions]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW, reason_code: REQUEST_ALLOWED, subject_kind: request}

  - id: valid_with_a_permitted_dimension_allows
    freshness: complete.yaml
    metrics: [app_sessions]
    dimensions: [app_version]
    sources: [app_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW, reason_code: REQUEST_ALLOWED, subject_kind: request}

  - id: store_combination_allows_with_a_material_offset_caveat
    why: >-
      The store closes its day in America/Los_Angeles, so one canonical day draws
      on two of its reporting days. That is a real limitation on the number, not
      a rounding detail, so it is surfaced rather than absorbed.
    freshness: complete.yaml
    metrics: [store_downloads]
    dimensions: [country]
    sources: [store_a]
    access: [standard]
    scope: default
    expect: {outcome: ALLOW_WITH_CAVEAT, reason_code: TIMEZONE_OFFSET_MATERIAL, subject_kind: source, subject_id: store_a}

  - id: summing_an_additive_metric_allows
    freshness: complete.yaml
    why: Additive metrics are what summing is for.
    metrics: [app_sessions]
    sources: [app_a]
    aggregate: sum
    access: [standard]
    scope: default
    expect: {outcome: ALLOW, reason_code: REQUEST_ALLOWED, subject_kind: request}

  - id: restricted_metric_allows_in_its_own_scope
    freshness: complete.yaml
    why: >-
      Proves the restricted denial above is about authorisation and not about a
      broken metric — the same request in the right scope is allowed.
    metrics: [restricted_metric]
    sources: [app_a]
    access: [restricted]
    scope: finance
    expect: {outcome: ALLOW, reason_code: REQUEST_ALLOWED, subject_kind: request}
