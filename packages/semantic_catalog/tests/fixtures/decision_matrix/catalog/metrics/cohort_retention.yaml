# T058 decision-matrix fixture — NOT production data, NOT a production approval.
# A self-contained miniature catalog whose sources ARE approved, so gates 4 and 5
# are reachable. The production catalog is deliberately unpublishable while D-1
# and D-8 are open; exercising a gate there is impossible by design, and faking
# an approval there would be inventing governance history.

# Cohort-grained, so mixing it with a day-grained metric is refused by Gate 5.
# The retention contract is COMPLETE here — a fixture, never production values.
# The production retention metrics stay pending under D-8 / D-9.
catalog_schema_version: 1
kind: metric
name: cohort_retention
owner: fixture_owner
access: standard
grain_family: cohort
versions:
  - version: 1
    effective_from: 2026-01-01
    source_view: semantic.fixture_cohort
    grain: cohort_date x product
    aggregation: ratio
    additivity: ratio
    unit: rate
    time_dimension: date
    numerator: Usuários da coorte que retornam no dia 7.
    denominator: Usuários da coorte.
    calculation_basis: Proporção de retorno exatamente no dia 7.
    allowed_dimensions: [country]
    content:
      lang: pt-BR
      label: Retenção de teste
      description: Retenção de coorte para o fixture.
retention:
  window_days: 7
  retention_style: exact_day
  cohort_assignment: first_eligible_activity
  cohort_timezone: America/Sao_Paulo
  eligible_event: Evento elegível do fixture.
  identity_rule: Regra de identidade do fixture.
  numerator: Usuários da coorte que retornam no dia 7.
  denominator: Usuários da coorte.
  min_maturity_days: 7
source_availability:
  - source: app_a
    status: available
    available_from: 2026-01-01
    effective_from: 2026-01-01
