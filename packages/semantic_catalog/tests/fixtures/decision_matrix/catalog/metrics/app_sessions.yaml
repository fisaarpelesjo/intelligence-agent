# T058 decision-matrix fixture — NOT production data, NOT a production approval.
# A self-contained miniature catalog whose sources ARE approved, so gates 4 and 5
# are reachable. The production catalog is deliberately unpublishable while D-1
# and D-8 are open; exercising a gate there is impossible by design, and faking
# an approval there would be inventing governance history.

catalog_schema_version: 1
kind: metric
name: app_sessions
owner: fixture_owner
access: standard
grain_family: day
versions:
  - version: 1
    effective_from: 2026-01-01
    source_view: semantic.fixture_daily
    grain: date x product
    aggregation: sum
    additivity: additive
    unit: sessions
    time_dimension: date
    calculation_basis: Sessões iniciadas no dia.
    allowed_dimensions: [country, app_version]
    content:
      lang: pt-BR
      label: Sessões do aplicativo
      description: Sessões iniciadas no dia.
source_availability:
  - source: app_a
    status: available
    available_from: 2026-01-01
    effective_from: 2026-01-01
