# T058 decision-matrix fixture — NOT production data.
#
# Carries a DEPRECATED access tag that names a valid replacement. Gate 3 must
# still deny: the replacement is evaluated on its own merits and never
# auto-granted, because inheriting authorisation from a retired tag is how stale
# access survives a cleanup.

catalog_schema_version: 1
kind: metric
name: retired_metric
owner: fixture_owner
access: retired_tag
grain_family: day
versions:
  - version: 1
    effective_from: 2026-01-01
    source_view: semantic.fixture_daily
    grain: date x product
    aggregation: sum
    additivity: additive
    unit: events
    time_dimension: date
    calculation_basis: Métrica do fixture com etiqueta aposentada.
    allowed_dimensions: [country]
    content:
      lang: pt-BR
      label: Métrica aposentada
      description: Métrica do fixture com etiqueta aposentada.
source_availability:
  - source: app_a
    status: available
    available_from: 2026-01-01
    effective_from: 2026-01-01
