[project]
name = "execucao-query"
version = "0.1.0"
description = "Execucao de query governada sob decisao de autorizacao do catalogo semantico."
requires-python = ">=3.12"
dependencies = [
  "catalogo-semantico",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/execucao_query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
catalogo-semantico = { workspace = true }
