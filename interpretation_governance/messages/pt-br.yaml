# pt-BR message registry for InterpretationReasonCode — 003:T023 (FR-039, FR-042; SC-028).
#
# Keyed by (code, language, content_version). Stored wording selected by code,
# never generated, paraphrased or translated at answer time — the same approach
# 001 and 002 both use, so a consumer cannot tell which of the three layers
# refused from message style.
#
# Coverage is a build gate: 32 codes, 32 messages, no orphan on either side
# (001's FR-074, inherited).
#
# INTERPOLATION IS ALLOWLISTED. Only the fields named in `allowed_arguments`
# below may be inserted. Never a metric value, a filter value, a credential,
# direct personal data or any span of the question text
# (contracts/governed-content.md §7).
#
# Two disclosure rules are encoded in the wording itself, not left to callers:
#
#   * QUESTION_EXCEEDS_STRUCTURAL_LIMIT names NO limit. It is reachable at
#     step 1, before the authorization-context preflight, so the principal is
#     not yet proven entitled to be told a governed number
#     (intake-contract.md §6). Its governed twin names one.
#   * TERM_NOT_GOVERNED is worded so that a term the catalog does not govern and
#     a candidate set emptied by authorization filtering read identically. The
#     wording is the mechanism for FR-050; a message that said "you may not see
#     this" would defeat it.
#
# AUTOMATION ASSERTS PRESENCE, COVERAGE AND STABILITY ONLY. Whether the
# Portuguese is correct stays the D-10 / 001:T117 reviewer duty and is never
# claimed by a test (FR-044).

schema_version: 1
kind: interpretation_messages

# No approved D-19 policy exists, so there is no policy version to key wording
# on. This sentinel names the wording set; it is not a default standing in for a
# missing policy — policy resolution refuses independently.
content_version: unversioned

# The closed set of interpolation field names. A message using anything else
# fails the build.
allowed_arguments:
  - metric_id
  - dimension_id
  - source_id
  - slot
  - period_expression
  - period_start
  - period_end
  - comparison_formula
  - governed_limit
  - round_bound
  - rounds_consumed
  - candidate_count
  - declared_language
  - supported_languages
  - expires_at
  - contract_version

messages:
  # --- intake --------------------------------------------------------------
  - code: INTAKE_MALFORMED
    language: pt-BR
    text: >-
      A solicitação não corresponde ao contrato de entrada: há campo
      desconhecido, tipo incorreto ou campo obrigatório ausente.
  - code: QUESTION_EMPTY
    language: pt-BR
    text: A pergunta está vazia ou contém apenas pontuação.
  - code: QUESTION_EXCEEDS_STRUCTURAL_LIMIT
    language: pt-BR
    text: >-
      A pergunta excede o tamanho aceito pelo contrato de entrada. Reduza o
      texto e envie novamente.
  - code: QUESTION_EXCEEDS_GOVERNED_LIMIT
    language: pt-BR
    text: >-
      A pergunta excede o limite governado de {governed_limit} caracteres.
    arguments: [governed_limit]
  - code: QUESTION_CONTENT_NOT_TEXTUAL
    language: pt-BR
    text: >-
      A pergunta contém caracteres de controle, marcação incorporada ou
      conteúdo não textual.
  - code: LANGUAGE_NOT_DECLARED
    language: pt-BR
    text: >-
      A pergunta não declarou um idioma. O idioma é sempre declarado pelo
      chamador e nunca é detectado, inferido ou pontuado pelo sistema.
  - code: LANGUAGE_NOT_SUPPORTED
    language: pt-BR
    text: >-
      O idioma declarado {declared_language} não faz parte do conjunto
      governado. Idiomas suportados: {supported_languages}.
    arguments: [declared_language, supported_languages]
  - code: QUESTION_NOT_ANALYTICAL
    language: pt-BR
    text: >-
      A pergunta não trata de dados de negócio governados. O sistema não
      responde a partir de conhecimento geral.

  # --- authorization context ------------------------------------------------
  # One message for every failure mode, matching the single code. Naming which
  # part of the context failed would describe the shape of the identity system
  # to a caller who has not authenticated.
  - code: AUTHORIZATION_CONTEXT_UNRESOLVABLE
    language: pt-BR
    text: >-
      O contexto de autorização não foi resolvido por completo. Nenhuma leitura
      de catálogo, resolução de termo, pedido de esclarecimento ou execução foi
      realizada.

  # --- governed content -----------------------------------------------------
  - code: INTERPRETATION_VOCABULARY_UNRESOLVABLE
    language: pt-BR
    text: >-
      Não há exatamente um vocabulário de interpretação vigente e completo.
      Nenhum valor padrão é assumido.
  - code: INTERPRETATION_POLICY_UNRESOLVABLE
    language: pt-BR
    text: >-
      Não há exatamente uma política de interpretação vigente e completa. Uma
      política sem algum dos campos obrigatórios não é parcialmente utilizável.

  # --- term resolution ------------------------------------------------------
  # Deliberately identical in effect to an authorization-emptied candidate set:
  # nothing here distinguishes "não existe" from "você não pode ver" (FR-050).
  - code: TERM_NOT_GOVERNED
    language: pt-BR
    text: >-
      Não há conceito governado correspondente ao termo informado para o campo
      {slot}. O sistema não aproxima para o termo governado mais próximo.
    arguments: [slot]
  - code: INTENT_AMBIGUOUS
    language: pt-BR
    text: >-
      O termo informado corresponde a {candidate_count} conceitos governados e
      não é possível pedir esclarecimento agora.
    arguments: [candidate_count]
  - code: SLOT_ROLE_AMBIGUOUS
    language: pt-BR
    text: >-
      O termo informado é ao mesmo tempo uma fonte governada e um valor de
      dimensão governado, e a pergunta não determina o papel pretendido.
  - code: IDENTIFIER_FABRICATED
    language: pt-BR
    text: O identificador informado não existe no catálogo governado.

  # --- period ---------------------------------------------------------------
  - code: PERIOD_EXPRESSION_NOT_GOVERNED
    language: pt-BR
    text: >-
      A expressão de período informada não consta do vocabulário governado. O
      sistema não aproxima para a expressão conhecida mais próxima.
  - code: PERIOD_CONVENTION_UNDECLARED
    language: pt-BR
    text: >-
      A expressão de período {period_expression} existe, mas o vocabulário
      governado não declara sua convenção de limite, inclusividade ou início de
      semana ou mês. O sistema não resolve sob convenção presumida.
    arguments: [period_expression]

  # --- clarification --------------------------------------------------------
  - code: CLARIFICATION_REQUIRED
    language: pt-BR
    text: >-
      A intenção não foi resolvida por completo. Escolha entre as opções
      governadas apresentadas e reenvie o contrato de esclarecimento.
  - code: CLARIFICATION_UNAVAILABLE
    language: pt-BR
    text: >-
      Não é possível emitir um contrato de esclarecimento com garantia de
      integridade. A pergunta é recusada em vez de esclarecida.
  - code: CLARIFICATION_EXHAUSTED
    language: pt-BR
    text: >-
      O limite governado de {round_bound} rodadas de esclarecimento foi
      alcançado.
    arguments: [round_bound]
  - code: CLARIFICATION_EXPIRED
    language: pt-BR
    text: >-
      O contrato de esclarecimento expirou em {expires_at}. Ele não é renovado
      nem estendido.
    arguments: [expires_at]
  - code: CLARIFICATION_TAMPERED
    language: pt-BR
    text: >-
      O contrato de esclarecimento não passou na verificação de integridade. Ele
      não é reparado, honrado parcialmente nem rebaixado a uma nova pergunta.
  - code: CLARIFICATION_VERSION_UNKNOWN
    language: pt-BR
    text: >-
      A versão {contract_version} do contrato de esclarecimento é desconhecida
      para esta versão do sistema.
    arguments: [contract_version]
  - code: CLARIFICATION_CONTEXT_MISMATCH
    language: pt-BR
    text: >-
      O contrato de esclarecimento foi emitido sob outro contexto de governança
      ou para outro solicitante.

  # --- calculation and safety -----------------------------------------------
  - code: CALCULATION_NOT_SUPPORTED
    language: pt-BR
    text: >-
      O cálculo solicitado não é expresso pelo vocabulário governado. Ele não é
      atendido por decomposição em etapas governadas.
  # Never echoes the refused content back — not here, not in the logs, not in
  # the traces, not in the audit event (FR-045).
  - code: INSTRUCTION_INJECTION_REFUSED
    language: pt-BR
    text: >-
      A pergunta contém instruções para alterar o comportamento governado do
      sistema. A solicitação foi recusada e o conteúdo não é reproduzido.
  - code: DISCLOSURE_WOULD_RECONSTRUCT
    language: pt-BR
    text: >-
      A resposta permitiria reconstruir um valor suprimido por regra de
      privacidade.

  # --- comparison and surfaces ----------------------------------------------
  - code: COMPARISON_NOT_ROUTABLE
    language: pt-BR
    text: >-
      A comparação solicitada não corresponde a nenhuma rota governada. A
      ausência de rota nunca é permissão.
  - code: COMPARISON_SIDE_INVALID
    language: pt-BR
    text: >-
      Um dos lados da comparação não é válido. A comparação inteira é recusada e
      nenhum lado é apresentado isoladamente.
  - code: MODEL_SURFACE_UNAVAILABLE
    language: pt-BR
    text: >-
      O refinamento por modelo seria necessário e não há provedor aprovado. A
      ambiguidade é esclarecida ou recusada, nunca posta em espera.

  # --- permitted ------------------------------------------------------------
  - code: QUESTION_ANSWERED
    language: pt-BR
    text: Pergunta interpretada, governada, executada e respondida.
  - code: QUESTION_ANSWERED_WITH_CAVEAT
    language: pt-BR
    text: >-
      Pergunta respondida com ressalvas governadas. Todas as ressalvas
      acompanham a resposta sem alteração.
