# Governed claim-class wording — D-18.
#
# The four classes themselves are fixed by the answer contract — FACTUAL_RESULT,
# CALCULATED_COMPARISON, INTERPRETATION and LIMITATION — because that typed
# separation is what makes SC-009 a contract test rather than a text-inspection
# exercise. Only their pt-BR label and disclosure wording are governed content,
# and a fifth class would be a contract change, not a content change.
#
# AUTHORED ON 2026-09-02 BY THE OWNER'S CLICK (OD-104, click 5; cycle 533): the
# four wordings the product's demonstration harness already used, promoted
# verbatim, WITH the owner's own pt-BR review standing as the D-10 gate the
# demo text had never passed — the click is the review. No wording carries a
# causal connective; `interaction validate-governance` runs clean over it.

schema_version: 1
kind: claim_classes

# A list of versioned instances, each with version, effective_from, an optional
# effective_to, an `approval` mapping and its `classes`. Each class declares
# claim_class, label (pt-BR) and disclosure (pt-BR).
instances:
  - version: "1"
    effective_from: 2026-09-02
    effective_to: null
    approval:
      approver_role: data_governance
      evidence_ref: >-
        owner decision OD-104 recorded in the governed loop channel on
        2026-09-02 (~23:2x America/Sao_Paulo), click 5: the four demonstration
        wordings promoted verbatim, the owner's own pt-BR review standing as
        the D-10 gate
      approved_on: 2026-09-02
    classes:
      - claim_class: FACTUAL_RESULT
        label: resultado medido
        disclosure: valor lido do armazem, sem alteracao
      - claim_class: CALCULATED_COMPARISON
        label: comparacao calculada
        disclosure: aritmetica deterministica sobre resultados
      - claim_class: INTERPRETATION
        label: interpretacao
        disclosure: leitura, nao medicao
      - claim_class: LIMITATION
        label: limitacao
        disclosure: o que este resultado nao afirma
