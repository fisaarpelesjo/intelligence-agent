# Governed interpretation policy — D-19. Owned by data governance, with privacy
# sign-off on the redaction rule, the cross-question disclosure rule and the
# clarification expiry.
#
# EMPTY AND UNAPPROVED BY DESIGN.
#
# All six fields are required together: ambiguity_threshold,
# clarification_round_bound, clarification_expiry_seconds,
# question_length_bound, redaction_rule and cross_question_disclosure. A policy
# carrying bounds but no redaction rule does not resolve — it is not partially
# usable. That single failure mode is deliberate: it removes any configuration
# in which the system runs with ambiguity controls but no untrusted-text
# screening, or the reverse.
#
# The redaction rule is Constitution IV's redaction half, which nothing in this
# repository currently declares. While it is absent, screening cannot run and
# the question refuses.
#
# While this file declares no instance, every question needing any of those
# values refuses with INTERPRETATION_POLICY_UNRESOLVABLE.
#
# DO NOT INVENT A THRESHOLD, BOUND, EXPIRY OR RULE.

schema_version: 1
kind: interpretation_policy

# A list of versioned instances, each with version, effective_from, an optional
# effective_to, an `approval` mapping and all six governed fields.
instances: []
