name: analytics-query

# Every gate below is blocking. None is advisory, and none continues on error:
# a gate that warns is a gate that gets ignored, and these are the checks that
# keep governed content and the code in agreement.
#
# The install uses `.[dev]` deliberately. `001`'s readiness workflow once
# installed without the extra and its pytest step failed on a missing
# interpreter module rather than on anything it guarded.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: analytics-query-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The catalog diff compares against the base ref, which needs history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install both packages
        run: |
          python -m pip install --upgrade pip
          # semantic_catalog first: analytics_query declares it as a path
          # dependency, and the install order is what supplies it.
          pip install -e "packages/semantic_catalog[dev]"
          pip install -e "packages/analytics_query[dev]"

      # --- formatting, linting, strict typing ------------------------------
      - name: Format check
        run: |
          python -m ruff format --check packages/semantic_catalog
          python -m ruff format --check packages/analytics_query

      - name: Lint
        run: |
          python -m ruff check packages/semantic_catalog
          python -m ruff check packages/analytics_query

      - name: Strict typing
        run: |
          cd packages/semantic_catalog && python -m pyright
          cd ../analytics_query && python -m pyright

      # --- the 001 regression, run in full -----------------------------------
      # This feature is additive. If it broke the catalog, that must fail here
      # rather than be discovered downstream.
      - name: semantic_catalog regression
        run: cd packages/semantic_catalog && python -m pytest -q

      - name: analytics_query suite
        run: cd packages/analytics_query && python -m pytest -q

      # --- governed content agrees with the contracts -----------------------
      - name: Governed content and readiness
        run: python -m analytics_query.cli.main validate-governance

      - name: Schema drift
        run: python -m analytics_query.cli.main schema export --check

      # --- the named structural gates ---------------------------------------
      # Each of these is a property that no behavioural test would catch: they
      # assert what the code *cannot* do, so they must run even when everything
      # passes.
      - name: Reason-code disjointness and matrix totality
        run: |
          cd packages/analytics_query
          python -m pytest -q tests/contract/test_reason_codes.py tests/contract/test_operator_matrix.py

      - name: SQL guards, compiler construction and no SQL surface
        run: |
          cd packages/analytics_query
          python -m pytest -q \
            tests/contract/test_guard_construction.py \
            tests/contract/test_no_sql_surface.py \
            tests/adversarial/test_emitted_text_guards.py \
            tests/adversarial/test_value_injection.py \
            tests/adversarial/test_identifier_injection.py

      - name: Value-free ledger, no result cache and audit contents
        run: |
          cd packages/analytics_query
          python -m pytest -q \
            tests/contract/test_value_free_ledger.py \
            tests/contract/test_no_result_cache.py \
            tests/contract/test_audit_contents.py

      - name: Fixture containment, dependency direction and adapter containment
        run: |
          cd packages/analytics_query
          python -m pytest -q \
            tests/contract/test_fixture_isolation.py \
            tests/contract/test_package_boundaries.py \
            tests/contract/test_observation_authority.py

      - name: Authorization before cost, preflight code set and no gate duplication
        run: |
          cd packages/analytics_query
          python -m pytest -q \
            tests/integration/test_authorization_before_cost.py \
            tests/contract/test_preflight_codes.py \
            tests/contract/test_no_gate_duplication.py

      - name: Date-filter refusal and filter rules
        run: cd packages/analytics_query && python -m pytest -q tests/unit/test_filter_rules.py

      - name: Readiness fails closed
        run: cd packages/analytics_query && python -m pytest -q tests/contract/test_readiness.py

      - name: Cross-artifact links
        run: |
          cd packages/semantic_catalog
          python -m pytest -q tests/contract/test_cross_artifact_links.py

      # --- hygiene ----------------------------------------------------------
      - name: No secrets, caches or runtime fixture switches
        run: |
          ! git grep -rlIE "(api[_-]?key|BEGIN [A-Z ]*PRIVATE KEY|password[[:space:]]*=)" \
            -- packages/analytics_query/src query_governance
          ! git grep -rlIE "(USE_FIXTURE|FIXTURE_MODE|os\.environ|getenv)" \
            -- packages/analytics_query/src
          test -z "$(git ls-files '*__pycache__*' '*.egg-info*')"

      - name: Whitespace
        run: git diff --check
