name: nl-analytics

# Every gate below is blocking. None is advisory, none continues on error, and none
# is `if: always()`: a gate that warns is a gate that gets ignored, and these are the
# checks that keep governed content, the code and the claims in agreement.
#
# The three existing workflows -- catalog, analytics-query, readiness-guard -- are left
# untouched. This one is additive, matching the dependency direction: 003 depends on
# 002 depends on 001, and never the reverse.
#
# `.[dev]` on every install, deliberately. 001's readiness workflow once installed
# without the extra and its pytest step failed on a missing interpreter module rather
# than on anything it guarded.
#
# What this workflow does NOT do, and must not: reach a warehouse, use a model
# provider, provision a seal key, or read any secret. There is no `secrets` reference
# below and no service container. Every result is fixture-backed and establishes
# internal contract behaviour only.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nl-analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nl-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The upstream node-ID regression compares against the base ref.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all three packages
        run: |
          python -m pip install --upgrade pip
          # Upstream first: the dependency direction is
          # semantic_catalog <- analytics_query <- analytics_interaction, and the
          # install order is what supplies each path dependency.
          pip install -e "packages/semantic_catalog[dev]"
          pip install -e "packages/analytics_query[dev]"
          pip install -e "packages/analytics_interaction[dev]"

      # --- formatting, linting, strict typing -------------------------------
      - name: Format check
        run: python -m ruff format --check packages/analytics_interaction

      - name: Lint
        run: python -m ruff check packages/analytics_interaction

      - name: Strict typing
        run: cd packages/analytics_interaction && python -m pyright

      # --- the whole suite, and it must not skip ----------------------------
      # `-p no:randomly` so a failure is reproducible from the log, and
      # `--strict-markers` so a typo in a marker is an error rather than a
      # silently uncollected test.
      - name: analytics_interaction suite
        run: |
          cd packages/analytics_interaction
          python -m pytest -q -p no:randomly --strict-markers

      # A skip is a test that did not run reported as a test that passed. The
      # suite has none, and this is what keeps it that way.
      - name: No skipped, xfailed or deselected tests
        run: |
          cd packages/analytics_interaction
          python -m pytest -q -p no:randomly -rs 2>&1 | tee /tmp/suite.txt
          if grep -qE "skipped|xfailed|xpassed|deselected" /tmp/suite.txt; then
            echo "::error::the suite reported a skip, an xfail or a deselection"
            exit 1
          fi

      # --- upstream regression: node IDs, not counts ------------------------
      # The invariant is the pre-existing pytest node-ID *set*, preserved and
      # passing. A suite can delete one test and add another and keep the same
      # total, so a count comparison would miss exactly the change that matters.
      # Additive suites are expected; the new total is context, never the gate.
      - name: semantic_catalog regression
        run: cd packages/semantic_catalog && python -m pytest -q

      - name: analytics_query regression
        run: cd packages/analytics_query && python -m pytest -q

      # Every node the upstream suites collect must also PASS, and a skip is a
      # test that did not run reported as one that did. Since the baseline node
      # set is asserted to be a subset of the current set below, a clean run here
      # is what makes "every preserved node still passes" true -- without needing
      # to pass 3400 node IDs on a command line.
      - name: Upstream suites run clean, with no skip, xfail or deselection
        run: |
          set -euo pipefail
          # A PARTICAO E PEDIDA AO PUSH HOOK, e nao escrita aqui -- 2026-09-06.
          #
          # Este passo exigia ZERO skips. Cinco nos do semantic_catalog MEDEM o armazem de
          # verdade e pulam sem credencial, dizendo isso no proprio motivo; o cabecalho deste
          # workflow PROIBE ler segredo nenhum. Entao o portao exigia o que o cabecalho proibia
          # satisfazer, e ficou vermelho desde 2026-09-03 por uma condicao que ninguem podia
          # cumprir. O `catalog.yml` recebeu a particao declarada no MESMO commit que trouxe o
          # primeiro skip (45c3b1c, T109/D-12); este arquivo ficou de fora por omissao.
          #
          # A regra e dele e nao muda: comparada por ARQUIVO E MOTIVO, nunca por contagem.
          # O que muda e onde ela mora -- no hook, uma vez, para as tres portas que a leem.
          for package in semantic_catalog analytics_query; do
            out=$( cd "packages/$package" \
              && python -m pytest -q -p no:randomly --strict-markers -rs 2>&1 ) \
              || { echo "$out"; exit 1; }
            echo "$out" | tail -5
            unexplained=$(echo "$out" | bash tools/git-hooks/pre-push --unexplained-skips "packages/$package") && judged=0 || judged=$?
            if [ "$judged" -ne 0 ]; then
              echo "::error::no skip partition is declared for packages/$package, so its skips were not judged"
              exit 1
            fi
            if [ -n "$unexplained" ]; then
              echo "::error::$package skipped a node outside the declared partition; a preserved node that does not run is not preserved"
              echo "$unexplained"
              exit 1
            fi
            # AS OUTRAS TRES PALAVRAS SEGUEM VETADAS INTEIRAS. So `skipped` tem particao, e ela
            # ja foi conferida por arquivo e motivo acima -- entao toda linha SKIPPED que
            # chegou aqui esta dentro dela. Reconciliar o TOTAL de
            # `skipped|xfailed|xpassed|deselected` contra as linhas SKIPPED declaradas e o que
            # impede um xfail, um xpass ou uma deselecao de passar por baixo do mesmo numero.
            # O PYTEST DOBRA SKIPS IGUAIS, e contar LINHAS aqui foi um defeito medido em
            # 2026-09-06: `_folded_skips` junta todo skip que partilha (arquivo, linha, motivo)
            # numa unica linha com um `[N]` a frente. O `test_ext_a_readiness_conditions.py:48`
            # e um `pytest.skip` dentro do helper `_client()`, chamado por quatro nos -- UMA
            # linha, contagem 4. Contar linhas dava `declared=2` contra `total=5` e este passo
            # saia 1 acusando um xfail que nunca existiu. Somar o `[N]` e o que compara o mesmo
            # numero dos dois lados. O `[N]` e OPCIONAL: sem ele a linha vale um.
            declared=$(echo "$out" | awk '/^SKIPPED/ { if ($2 ~ /^\[[0-9]+\]$/) { n = $2; gsub(/[^0-9]/, "", n); s += n } else { s += 1 } } END { print s+0 }')
            total=$(echo "$out" | awk '{for (i = 1; i < NF; i++) if ($(i + 1) ~ /^(skipped|xfailed|xpassed|deselected)/) s += $i} END {print s+0}')
            if [ "$total" -ne "$declared" ]; then
              echo "::error::$package reported $total non-passing outcomes against $declared declared skips; an xfail, an xpass or a deselection is not a pass"
              exit 1
            fi
            echo "scope evidence: $package -- $declared skip(s), all inside the declared partition"
          done

      # Baseline selection, stated before it is used so a reader can see which
      # commit the comparison is against without reading the collection logic.
      #
      # pull_request: the base the PR would merge into. It legitimately predates
      # this feature -- `packages/analytics_interaction` does not exist there, and
      # neither does `analytics_query.execute`. That is expected and handled: the
      # baseline is only ever asked for 001 and 002.
      #
      # push: `github.event.before`, except when it is absent or the all-zero SHA
      # that a branch's first push reports. `HEAD^` is the documented fallback and
      # is used only then.
      - name: Resolve the upstream baseline commit
        id: baseline
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          pr_base="${{ github.event.pull_request.base.sha }}"
          push_before="${{ github.event.before }}"
          zero="0000000000000000000000000000000000000000"

          case "$event" in
            pull_request|pull_request_target)
              candidate="$pr_base"
              origin="pull_request.base.sha"
              ;;
            push)
              if [ -n "$push_before" ] && [ "$push_before" != "$zero" ]; then
                candidate="$push_before"
                origin="push.before"
              else
                # Documented fallback, and deliberately narrow: a first push to a
                # branch reports an all-zero `before`, and HEAD^ is the nearest
                # honest baseline. Anything else must fail rather than guess.
                candidate="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
                origin="HEAD^ (fallback: push.before was absent or all-zero)"
              fi
              ;;
            *)
              candidate=""
              origin="unsupported event: $event"
              ;;
          esac

          if [ -z "$candidate" ]; then
            echo "::error::no upstream baseline could be resolved ($origin). The node-ID guard needs a commit to compare against and must not silently skip."
            exit 1
          fi
          if ! git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
            echo "::error::resolved baseline $candidate ($origin) is not a commit in this repository"
            exit 1
          fi

          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "baseline: $candidate  (from $origin)"

      # --- the guard itself --------------------------------------------------
      # Collected from an ISOLATED worktree of the baseline commit, with its own
      # virtual environment.
      #
      # The previous version checked `packages/` out of the baseline **over the
      # current tree**. On a pull_request that mixes 001/002 at the base with 003
      # at the head, installed editable against an `analytics_query` that no
      # longer has `execute.py` -- an uncollectable repository, and pytest exited
      # 2 before the comparison ran. Nothing in the head checkout is touched now.
      #
      # 003 is never collected from the baseline: it does not exist there, and the
      # current 003 must never be imported against base 002 code.
      - name: Upstream node-ID preservation
        run: |
          set -uo pipefail
          baseline="${{ steps.baseline.outputs.sha }}"
          worktree="$RUNNER_TEMP/upstream-baseline"
          venv="$RUNNER_TEMP/baseline-venv"

          # Cleanup runs on every exit path, including a collection failure, and
          # removes only what this step created.
          cleanup() {
            git worktree remove --force "$worktree" >/dev/null 2>&1 || true
            git worktree prune >/dev/null 2>&1 || true
            rm -rf "$venv" || true
          }
          trap cleanup EXIT

          git worktree add --detach --quiet "$worktree" "$baseline" || {
            echo "::error::TOOLING: could not create a baseline worktree at $baseline"
            exit 1
          }

          # A separate interpreter, so baseline collection resolves the baseline
          # sources rather than the editable installs from the head checkout.
          python -m venv "$venv"
          baseline_python="$venv/bin/python"
          "$baseline_python" -m pip install --upgrade pip --quiet
          for package in semantic_catalog analytics_query; do
            "$baseline_python" -m pip install --quiet -e "$worktree/packages/$package[dev]" || {
              echo "::error::TOOLING: baseline install failed for $package at $baseline"
              exit 1
            }
          done

          # `collect <label> <python> <root> <package> <sha> <out>`
          #
          # Diagnostics are printed, never swallowed. The previous version sent
          # every line of pytest output into the redirect file, so a collection
          # error left nothing in the log but an exit code.
          collect() {
            local label="$1" interpreter="$2" root="$3" package="$4" sha="$5" out="$6"
            local raw="$RUNNER_TEMP/${label}-${package}-collect.txt"
            local status=0

            ( cd "$root/packages/$package" \
              && PYTHONPATH= PYTHONDONTWRITEBYTECODE=1 \
                 "$interpreter" -m pytest -q --collect-only \
                 -p no:randomly -p no:cacheprovider ) > "$raw" 2>&1 || status=$?

            if [ "$status" -ne 0 ]; then
              echo "::error::COLLECTION FAILURE ($label side) -- package=$package commit=$sha exit=$status"
              echo "--- pytest collection diagnostics ($label / $package) ---"
              grep -E "^(ERROR|E |ImportError|ModuleNotFoundError|_{5,}|.*error)" "$raw" | head -25 \
                || tail -25 "$raw"
              echo "--- end diagnostics ---"
              return 1
            fi

            grep '::' "$raw" | sed 's/[[:space:]]*$//' | sort -u > "$out"
            if [ ! -s "$out" ]; then
              echo "::error::COLLECTION FAILURE ($label side) -- package=$package commit=$sha collected zero nodes"
              tail -25 "$raw"
              return 1
            fi
            return 0
          }

          failed=0
          for package in semantic_catalog analytics_query; do
            base_ids="$RUNNER_TEMP/${package}-base.txt"
            head_ids="$RUNNER_TEMP/${package}-head.txt"

            collect baseline "$baseline_python" "$worktree" "$package" "$baseline" "$base_ids" || {
              failed=1
              continue
            }
            collect current "$(command -v python)" "$GITHUB_WORKSPACE" "$package" "${{ github.sha }}" "$head_ids" || {
              failed=1
              continue
            }

            missing="$(comm -23 "$base_ids" "$head_ids" || true)"
            added="$(comm -13 "$base_ids" "$head_ids" || true)"

            base_count="$(wc -l < "$base_ids")"
            head_count="$(wc -l < "$head_ids")"
            missing_count="$([ -n "$missing" ] && printf '%s\n' "$missing" | wc -l || echo 0)"
            added_count="$([ -n "$added" ] && printf '%s\n' "$added" | wc -l || echo 0)"

            echo "$package: baseline=$base_count current=$head_count missing=$missing_count additive=$added_count"

            if [ -n "$missing" ]; then
              # A vanished node is excused ONLY as a DECLARED rename: its canonical
              # id matches the left side of a line in the versioned map AND the
              # right side exists in the current collection. Everything else is a
              # real regression, named on its own ::error:: line. The baseline is
              # never advanced over this file: the map is the dated amendment and
              # the guard keeps its memory (OD-79, 2026-09-01).
              renames="$GITHUB_WORKSPACE/.github/upstream-node-renames.txt"
              head_canon="$RUNNER_TEMP/${package}-head-canon.txt"
              tr '\\' '/' < "$head_ids" | tr -s '/' > "$head_canon"
              while IFS= read -r node; do
                [ -n "$node" ] || continue
                canon="$(printf '%s' "$node" | tr '\\' '/' | tr -s '/')"
                new_id=""
                if [ -f "$renames" ]; then
                  new_id="$(grep -F "$package: $canon -> " "$renames" | head -1 | sed 's/^.* -> //')"
                fi
                if [ -n "$new_id" ] && grep -qxF "$new_id" "$head_canon"; then
                  echo "$package: declared rename (OD-79 map): $canon -> $new_id"
                else
                  echo "::error::NODE-ID REGRESSION -- $package node vanished since $baseline: $node"
                  failed=1
                fi
              done <<< "$missing"
            fi
          done

          # 003 is deliberately absent from the loop. It does not exist at the
          # baseline, and collecting it against base 002 code is the exact mix
          # that produced the original failure.
          if [ -d "$worktree/packages/analytics_interaction" ]; then
            echo "note: the baseline contains packages/analytics_interaction; it is still not collected from there, by design"
          fi

          exit "$failed"

      # --- governed content and schema drift --------------------------------
      # Both exit 1 today: D-18 and D-19 ship empty. The gate is that they
      # refuse with a governed code, not that they succeed.
      - name: Governed content resolves or names its reason
        run: |
          cd packages/analytics_interaction
          set +e
          python -m analytics_interaction.cli vocabulary show --on 2026-01-01
          vocabulary=$?
          python -m analytics_interaction.cli policy show --on 2026-01-01
          policy=$?
          set -e
          # 0 = resolved, 1 = a governed refusal. Anything else is a broken
          # invocation, and 2 in particular would mean the documented command
          # stopped parsing.
          for code in "$vocabulary" "$policy"; do
            if [ "$code" -gt 1 ]; then
              echo "::error::a governed-content command exited $code"
              exit 1
            fi
          done

      - name: Schema drift
        run: |
          cd packages/analytics_interaction
          python -m analytics_interaction.cli schema export --check

      - name: Governed message coverage
        run: |
          cd packages/analytics_interaction
          python -m analytics_interaction.cli messages > /dev/null
          python -m pytest -q tests/contract/test_message_coverage.py

      # --- the named structural gates ---------------------------------------
      # Each asserts what the code *cannot* do, so each must run even when every
      # behavioural test passes. Grouped by the property, not by directory, so a
      # failing group names the guarantee that broke.
      - name: Reason-code namespace, count and audit-stage enum
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/contract/test_reason_codes.py \
            tests/contract/test_audit_contract.py \
            tests/contract/test_contract_field_sets.py

      - name: Authorization before interpretation, counted zero
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/integration/test_authorization_before_interpretation.py \
            tests/integration/test_no_probing.py \
            tests/integration/test_clarification_zero_calls.py

      - name: Model-surface reachability and port absence
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/contract/test_model_surface_reachability.py \
            tests/contract/test_model_port_types.py \
            tests/contract/test_no_model_reopen.py \
            tests/integration/test_no_model_available.py

      - name: No detection, no clock, no persistence, no local index
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/contract/test_no_detection.py \
            tests/contract/test_no_clock.py \
            tests/contract/test_no_persistence.py \
            tests/contract/test_no_local_index.py

      - name: Value-free observability and no free text at rest
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/contract/test_audit_content_scan.py \
            tests/contract/test_audit_fields.py \
            tests/contract/test_no_foreign_values.py \
            tests/integration/test_values_untouched.py

      - name: Routing totality, comparison atomicity and exact arithmetic
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/unit/test_comparison_routing.py \
            tests/property/test_never_one_side.py \
            tests/adversarial/test_partial_comparison.py \
            tests/integration/test_whole_comparison.py

      - name: Caveat integrity and answer completeness
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/property/test_caveat_integrity.py \
            tests/contract/test_answer_elements.py \
            tests/contract/test_channel_agnostic.py \
            tests/integration/test_answer_assembly.py

      - name: Seal integrity, statelessness and replay posture
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/adversarial/test_seal_tampering.py \
            tests/adversarial test_replay.py 2>/dev/null || \
          python -m pytest -q \
            tests/adversarial/test_seal_tampering.py \
            tests/adversarial/test_replay.py \
            tests/integration/test_stateless_clarification.py \
            tests/integration/test_quickstart_9_12.py

      - name: Fixture containment, no embedded key and dependency direction
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/contract/test_fixture_containment.py \
            tests/contract/test_no_embedded_key.py \
            tests/contract/test_package_boundaries.py

      - name: ADR 0010 port narrowness and entry-point equivalence
        run: |
          cd packages/analytics_query
          python -m pytest -q tests/contract/test_adr0010_scope.py

      - name: Determinism and reproducibility
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/property/test_determinism.py \
            tests/property/test_identity_dates.py \
            tests/property/test_refusal_invariants.py

      # --- the twelve quickstart scenarios ----------------------------------
      - name: Quickstart scenarios 1-12
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/integration/test_quickstart_1_4.py \
            tests/integration/test_quickstart_5_8.py \
            tests/integration/test_quickstart_9_12.py

      # --- eval-driven coverage ---------------------------------------------
      - name: Golden corpus, adversarial corpus and the eight graders
        run: |
          cd packages/analytics_interaction
          python -m pytest -q tests/eval

      # The report is committed. If a run would change it, the corpus or the
      # graders moved and the change belongs in the diff rather than in CI.
      - name: Grader report is byte-identical to the committed one
        run: |
          cd packages/analytics_interaction
          python -m pytest -q tests/eval > /dev/null
          cd ../..
          git diff --exit-code -- docs/release/nl-analytics-grader-report.json

      # --- coverage audits ---------------------------------------------------
      # Derived from source modules and collected tests, never from tasks.md.
      - name: FR and SC coverage audits
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/contract/test_fr_coverage_intake.py \
            tests/contract/test_fr_coverage_interpretation.py \
            tests/contract/test_fr_coverage_answer.py \
            tests/contract/test_fr_coverage_governance.py \
            tests/contract/test_fr_coverage.py \
            tests/contract/test_sc_coverage.py

      # --- readiness and claims ---------------------------------------------
      # Fifteen records open, aggregate NONE, and no artifact claiming
      # otherwise. This is the gate that stops a green run from becoming a
      # readiness claim.
      - name: Readiness stays NONE and no artifact claims readiness
        run: |
          cd packages/analytics_interaction
          python -m pytest -q \
            tests/contract/test_readiness.py \
            tests/contract/test_aggregate_readiness.py \
            tests/contract/test_no_readiness_claim.py \
            tests/contract/test_sc030_unmeasurable.py

      # --- reproducibility across hash seeds --------------------------------
      # Two seeds, not one: a single seed proves the suite passes, and the claim
      # is that it passes the same way regardless of dict ordering.
      - name: Hash-seed reproducibility
        run: |
          cd packages/analytics_interaction
          PYTHONHASHSEED=0 python -m pytest -q -p no:randomly
          PYTHONHASHSEED=1337 python -m pytest -q -p no:randomly

      # --- hygiene -----------------------------------------------------------
      - name: Whitespace and conflict markers
        run: git diff --check HEAD~1 || git diff --check
