name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  delivery-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Branch name
        run: uv run python scripts/delivery.py validate-ci --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
      - name: PR title
        if: github.event_name == 'pull_request'
        run: uv run python scripts/delivery.py validate-ci --pr-title "${{ github.event.pull_request.title }}"
      - name: Convergence
        run: uv run python scripts/verify.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Sync
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Verify
        run: uv run python scripts/verify.py
