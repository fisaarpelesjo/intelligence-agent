name: multichannel

# T030. Every gate below is blocking. None is advisory, none continues on error, and
# none is `if: always()`: a gate that warns is a gate that gets ignored, and these are
# the checks that keep governed content, the code and the claims in agreement.
#
# The four existing workflows -- catalog, analytics-query, nl-analytics, readiness-guard
# -- are left untouched. This one is additive, matching the dependency direction:
# 004 depends on 003 depends on 002 depends on 001, and never the reverse.
#
# `.[dev]` on every install, deliberately: 001's readiness workflow once installed
# without the extra and its pytest step failed on a missing module rather than on
# anything it guarded.
#
# What this workflow does NOT do, and must not: reach a warehouse, use a model
# provider, contact a channel provider or a provider sandbox, provision a credential,
# or read any secret. There is no `secrets` reference below and no service container.
# Every result is fixture-backed and establishes internal contract behaviour only.
#
# Phase A scope. The gates for verification, preservation, delivery, idempotency and
# the interaction port arrive with Phases B, C, D0 and D; adding them now would mean
# gates that pass because nothing they guard exists yet.
#
# SCHEMA EXPORT AND SCHEMA-DRIFT GATE: DEFERRED, NOT FORGOTTEN.
#
# The three earlier workflows each run a schema-drift check, so its absence here is
# visible and could read as an oversight. It is not. The surface it would check does not
# exist yet: the steward CLI that exports the schema is T150, and the contract test that
# asserts an export without drift is T152 — both in Phase E, both outside the Phase A
# authorization. A gate over an absent CLI would pass because there is nothing to drift,
# which is worse than no gate: it would report a guarantee nobody is holding.
#
# T150 and T152 own it. This comment is the record, and T030's note in
# specs/004-multichannel-integration/tasks.md carries the same statement.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: multichannel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multichannel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The upstream node-ID regression compares against the base ref.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all four packages
        run: |
          python -m pip install --upgrade pip
          # Upstream first: the dependency direction is
          # semantic_catalog <- analytics_query <- analytics_interaction <- channel_integration,
          # and the install order is what supplies each path dependency.
          pip install -e "packages/semantic_catalog[dev]"
          pip install -e "packages/analytics_query[dev]"
          pip install -e "packages/analytics_interaction[dev]"
          pip install -e "packages/channel_integration[dev]"

      # --- formatting, linting, strict typing -------------------------------
      - name: Format check
        run: python -m ruff format --check packages/channel_integration

      - name: Lint
        run: python -m ruff check packages/channel_integration

      - name: Strict type check
        run: python -m pyright
        working-directory: packages/channel_integration

      # --- tests -------------------------------------------------------------
      - name: Tests
        run: python -m pytest -q
        working-directory: packages/channel_integration

      # --- governed content and vocabularies ---------------------------------
      # Named explicitly rather than folded into the suite above, so a failure names
      # the guarantee that broke instead of "some test failed".
      - name: Four-way reason-code disjointness
        run: python -m pytest tests/contract/test_reason_code_namespaces.py -q
        working-directory: packages/channel_integration

      - name: Reason-code count and outcome totality
        run: python -m pytest tests/contract/test_reason_code_totality.py -q
        working-directory: packages/channel_integration

      - name: Audit-stage enum, closed and ordered
        run: python -m pytest tests/contract/test_audit_stages.py -q
        working-directory: packages/channel_integration

      - name: Contract hygiene -- frozen, closed, no authority field
        run: python -m pytest tests/contract/test_contract_hygiene.py -q
        working-directory: packages/channel_integration

      - name: Governed message coverage and determinism
        run: python -m pytest tests/contract/test_messages.py -q
        working-directory: packages/channel_integration

      - name: Readiness guard -- ten locks undeclared, aggregation additive
        run: python -m pytest tests/contract/test_readiness.py -q
        working-directory: packages/channel_integration

      - name: Import boundary and dependency direction
        run: python -m pytest tests/contract/test_dependency_direction.py -q
        working-directory: packages/channel_integration

      - name: No readiness claim, no fabricated credential
        run: python -m pytest tests/contract/test_no_readiness_claim.py -q
        working-directory: packages/channel_integration

      # --- upstream preservation ---------------------------------------------
      # Node-ID preservation, not count equality. A vanished, skipped or deselected node
      # fails; a larger total is expected and reported informationally.
      - name: Upstream suites must stay whole
        run: |
          python -m pytest -q packages/semantic_catalog
          python -m pytest -q packages/analytics_query
          python -m pytest -q packages/analytics_interaction

      - name: Repository-wide artifact guards
        run: python -m pytest tests/contract/test_cross_artifact_links.py -q
        working-directory: packages/semantic_catalog
