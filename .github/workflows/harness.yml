name: harness

# The sixth workflow, and it exists because of a measurement rather than a preference:
# **none of the other five reads `apps/telegram-bot`**. Every step in
# `catalog`, `analytics-query`, `nl-analytics`, `readiness-guard` and `multichannel` is scoped to
# `packages/*` or to a governance directory, so `6ff233e` is 5/5 green while the 40 modules and the
# nodes of this directory have never been judged by CI at all -- including the guard that decides
# whether a figure was fabricated, and the per-sender destination that is a security change.
#
# The five existing workflows are left untouched. This one is additive.
#
# ## What this workflow must not do, and does not
#
# There is no `secrets` reference below, no service container, no provider call and no warehouse
# call. The harness reads a bot token, a model key and warehouse credentials **from the
# environment**, and none of the three exists on a runner: `HarnessConfig.from_environment` refuses
# by naming the absent variable, which is the fail-closed behaviour, and no node here depends on
# any of them being present. `.env` is git-ignored, so it is absent on a runner by construction --
# the two nodes that scan this directory for a token-shaped string exclude it by name and pass
# either way.
#
# A node that tried to reach the network would **fail**, not skip. Nothing below is `continue-on-
# error`, nothing is `if: always()`, and no marker is deselected: a skipped node is a gate that
# warns, and a gate that warns is a gate that gets ignored.
#
# ## Three resolutions this workflow makes deliberately, because the authorization required naming
# them rather than inheriting them
#
# **1. Dependencies: the gate installs the four packages and nothing else.** Not an inline package
# list, and not a dev-requirements file. The harness declares no dependencies on purpose -- its
# `pyproject.toml` has no `[project]` table, because deleting this directory whole must break no
# production package -- and yet it imports `google.cloud.bigquery`, `pydantic`, `yaml` and the four
# packages themselves. The resolution: every third-party name it imports is **already a pinned
# dependency of one of the four packages it exercises**, so installing those four supplies the whole
# environment and this directory still declares nothing. An inline list would be a second statement
# of what the code imports, free to drift from the first in silence; a requirements file here would
# contradict the sentence at the top of this directory's own `pyproject.toml`.
# `tests/test_dependencies.py` is what stops that resolution rotting: it reads the import graph from
# the syntax tree, walks function bodies as well as module level, and fails **naming the module** if
# anything imported is pinned nowhere. That node runs first below, before any gate that would
# otherwise report an undeclared import as a broken workflow.
#
# **2. `pyright`'s `venvPath = "../.."` and `venv = ".venv"`: the environment is built where the
# config already points, and the config is not touched.** On a runner there is no `.venv` at the
# repository root, and the reviewer measured what that costs -- twelve false
# `reportUnknownMemberType` errors about `google.cloud.bigquery` in a tree where the real answer is
# zero. Editing the harness's `pyproject.toml` was the other option and it is worse: those four gate
# sections are byte-matched to `packages/channel_integration/pyproject.toml` on purpose, so a tool
# demonstrating the feature is held to the feature's own standard. So the install step below creates
# the virtual environment at `.venv` **in the repository root**, which is exactly the path the
# existing config resolves, and every gate runs that interpreter.
#
# **3. Python 3.12, matching the five and matching the config.** `ruff`'s `target-version` is
# `py312` and `pyright`'s `pythonVersion` is `3.12`, so the gates are configured to judge this code
# **as** 3.12. Running a 3.13 interpreter underneath a 3.12 judgement is the mismatch that hides
# real findings.
#
# ## Scope evidence, not just a verdict
#
# Every gate below prints **what it saw**: the node count, the file count `ruff` walked, the file
# count `pyright` analysed. With an undeclared dependency and a `venvPath` that does not resolve,
# the shortest path to a green run is not having run what you think you ran -- so a green verdict
# over zero files is the failure this workflow is written to make impossible. Each count is derived
# from the tool's own output, never restated by hand.
#
# `HARNESS_NODE_FLOOR` is a floor, not an equality. A node that vanishes, is skipped or is
# deselected drops the total below it and fails; adding nodes passes and reports the new total. The
# floor is a measured number and moves only deliberately.
#
# ## No gate over an absent surface
#
# There is no schema-export or schema-drift step here, for the same reason `multichannel` has none:
# the CLI that would export it is T150 and the contract test is T152, both unbuilt. There is no
# channel-enabled step, no readiness step and no warehouse step: this directory changes none of
# those, and the four governed files it must not change are already asserted by
# `tests/test_no_governance_change.py`, which runs in the suite below.
#
# One declared gap, and it is a gap rather than a gate: `tests/conftest.py` opens with "No test in
# this directory opens a socket", and that is a **docstring claim, not an enforced invariant** --
# there is no autouse fixture that blocks a socket. On a runner an attempted connection has no
# credential to use and would surface as an error rather than a skip, so the posture holds, but it
# holds by circumstance. Enforcing it would mean adding a fixture to `conftest.py`, which is suite
# behaviour and not this workflow's authorized scope.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

# (Este bloco ja foi um `env:`; a chave saiu com o HARNESS_NODE_FLOOR e um `env:` sem
# filhos e um arquivo de workflow INVALIDO para o GitHub -- medido em 2026-09-01, o run
# falhou em 0s com o nome igual ao caminho. Os comentarios ficam; a chave nao.)
  # Measured on 2026-08-24: 768 nodes = unit 495 + integration 47 + adversarial 0 + security 226,
  # with zero unmarked and zero residue. The trail, because every step was a finding:
  # 735 with unit 462; 750 when cycle 210 added nine nodes for the backend-conditional data-nature
  # rule and six for the poll/request ceiling; 760 when the rule was found to forbid two claims while
  # the guard measured one; 778 when the guard matched one negation while pt-BR has a closed class of
  # them; 789 when the same guard was found refusing a **correct** answer, because the negation it
  # saw belonged to the banner the system requires in every real delivery; and then **down** to 768,
  # which is the only step in this trail that lowers the floor and therefore the one that needs a
  # reason. The guard stopped matching patterns over free text: the mandatory notice is appended by
  # the harness after judging, so a window, a clause boundary, a negation class and a subtraction
  # pattern all became unreachable, and the twenty-one nodes that measured those four mechanisms went
  # with them. A node whose docstring names a mechanism that no longer exists is what let one of
  # those findings be born, so they are deleted rather than kept green.
  #
  # Raised deliberately, always in the same change that adds the nodes: a floor left behind would let
  # the new nodes vanish without the gate noticing, which is the whole failure the floor exists to
  # catch.
  #
  # And 785 with the third aggregation class, `Snapshot`, which neither sums nor divides but
  # takes the value of the last covered day. Seventeen nodes, and the ones worth naming are the
  # three that make the class independently checkable: the class is declared in `metrics`,
  # mapped to an aggregate in `bigquery_backend`, and listed a third time by hand in the tests,
  # so no two of the three statements are derived from each other. Summing a window of MAU
  # instead answers 1334342 where the last day answers 24176 -- fifty-five times, measured.
  #
  # And 794 with the presentation axis. `as_delivered` multiplied by one hundred if and only if
  # the aggregate was the ratio one, so "divides after the sums" and "delivered as a percentage"
  # were one declaration -- true of all eight percentage KPIs and of nothing else, until
  # `LTV (months)` arrived. It divides and is not a percentage, and under the old line it would
  # have been delivered as 1222.85 months where the source says 12.23.
  #
  # And 806 with the density guard and the node that keeps `CAC (R$)` excluded on purpose. The
  # guard cannot be a step here and that is the constraint that shaped it: this workflow has no
  # secret and no network, by authorization, so nothing in CI can measure warehouse data. Density
  # is a property of the DATA, so the guard lives on the query path and produces a caveat or a
  # refusal for the sender; these nodes measure the GUARD with fixture rows. The number worth
  # naming is zero: `SUM(IF(is_last_covered, value, 0))` answers ZERO when the day it reads carries
  # no value, so a snapshot over an empty day delivered a figure with the right shape, the right
  # unit and a complete provenance, and nothing false in it except the number.
  #
  # 807 rather than 806 because a plant wrote the last one. Silencing the caveat for every read
  # above ten per cent density left the suite green: the guard had only been measured against a
  # SPARSE read, 12 of 176, which is the case a reader would catch from the magnitude alone. The
  # reading that needed the node is the near-full one -- 2835 of 2837, the measured density of
  # Cancellations (%) -- where a figure missing two slices looks exactly like a figure missing none.
  #
  # And 810 with the three nodes that keep the currency-pair KPIs unbound. The measurement is the
  # reason and it contradicts this repository own mapping document: value and numerator are NOT the
  # same amount in two currencies. The per-row ratio runs from 0 to 884 with three quarters of the
  # rows at zero, value is non-zero for 22 to 32 countries out of 176 with about 95 per cent of its
  # sum in Brazil, and numerator is non-zero for 139 to 176. Binding Revenue (US$) to the counting
  # class would sum value under a label saying dollars -- wrong currency AND a fraction of the
  # countries, with a complete provenance and no caveat. The density guard would NOT catch it,
  # which is that guard boundary: those rows are not null, they are ZERO.
  #
  # And 828 with the three currency KPIs bound, which closes the MVP at NINETEEN of twenty -- the
  # twentieth excluded by a dated owner decision, not missing. They read `numerator` and never
  # `value`, on the owner decision of 2026-08-24, and that forced a THIRD axis: the class says how
  # it aggregates, the presentation says how it is written, and SourceColumn says which column it
  # comes from. Revenue (US$) is a count over numerator while New trials is a count over value, so
  # the class no longer determines the column. Two numbers name the risk: summing the MRR window
  # gives 1564793.46 where the last covered day gives 48312.34, a factor of thirty-two; and the
  # figure EXCLUDES whoever paid in BRL, which now travels as a delivered limitation claim rather
  # than a provenance line the sender never reads.
  #
  # 831 rather than 828 because a plant wrote the last three. Removing the exclusion claim from the
  # DELIVERED path left the suite green: the node watched `provenance.limitations`, and it was then
  # measured that a provenance limitation NEVER reaches the sender on this path -- the coverage
  # sentence sits in the record while the answer ships with the banner alone. A node watching the
  # provenance watches a place the reader never looks.
  #
  # And 838 with F89 closed: every limitation the backend produces now reaches the SENDER. It was
  # measured that none of them did -- coverage, snapshot date, density and conversion were all
  # correct, all unconditional where they claimed to be, and all written to the record while the
  # answer shipped with the mandatory banner alone. The fix is not four sentences: a per-run
  # envelope forwards whatever the provenance carries except a short NAMED record-only list, so a
  # caveat added later arrives without a second edit. Two plants wrote three of these nodes, both
  # by passing: one watched the deposit instead of the delivery, the other the provenance instead
  # of the claim -- the same error one layer further out each time.
  #
  # And 842 with F90: the limitations now speak the language the channel speaks. They were written
  # in English because they never left the record, and F89 made them visible -- so the first thing
  # a reader saw was an English sentence in a channel whose every other word is Portuguese. The
  # nodes do NOT name the four sentences: they test the delivered body for English FUNCTION words,
  # which is what makes a FIFTH sentence born in English fail rather than pass unnoticed. Function
  # words rather than vocabulary because KPI names like New trials sit inside Portuguese sentences.
  # One collision is measured and excluded with its reason: stripped of its accent the Portuguese
  # "so" is spelled like the English one.
  #
  # And 850 with F91 and F85. F91 came from a REAL message rather than an audit: at 21:18 the owner
  # asked `novos trials ontem` and got a governed refusal, while the answer existed -- 607. The
  # request anchored relative periods on `at.date()` where `at` is UTC, so between 21:00 and 23:59
  # in Sao Paulo every relative period slid one day forward and the window fell outside coverage.
  # The nodes do NOT pin the hour: they assert the anchor is the canonical date at instants that
  # straddle the UTC boundary, plus one node proving the table really straddles it. F85 removes the
  # [demonstracao] prefix, which said demonstration beside a banner saying the data is real, and
  # its nodes read the DELIVERED body rather than listing the four labels.
  #
  # And 854 with F92, F93 and F94. F92 is the sharpest: the timezone node asserted its docstring
  # only by accident -- a reviewer plant swapped the canonical zone for America/New_York, a WRONG
  # zone rather than UTC, and the whole suite stayed green, because all five instants had Sao Paulo
  # and New York on the same date. The table asserted "some zone west of UTC". One instant fixes
  # it, and the GUARD node now demands both separations, since it existed precisely to prevent a
  # weak table and had itself been built one axis short. F93: one node passed Path(".") and wrote
  # into the working tree; nobody saw it because .gitignore covers the harness jsonl, so the residue
  # gate reported 0 honestly -- it measures tracked files. F94 delivers the one part of the owner's
  # approved format that lives in the harness: the unit stops arriving in English beside a
  # Portuguese label. The two domain anglicisms stay, with a node saying so out loud.
  #
  # And 859 with F95 and F96, which are adjacent in time and unrelated in mechanism -- the trail
  # says so here because a later reader would otherwise take them for one change. F95: the
  # mandatory notice reached the reader TWICE in the same fragment on the path that has an
  # interpretation, once glued to the prose and once as the LIMITATION claim; measured at 645
  # characters in ONE fragment, so fragmentation was never involved. F96 raises the demonstration
  # ceiling from 1200 to Telegram's real 4096: the low number was hygiene bought in the wrong
  # place, since it made every answer the owner reads travel under a limit the channel does not
  # impose. The coverage the 1200 bought is NOT dropped -- it moves into a node that declares its
  # own 200 character capability, so what the suite exercises and what the owner reads stop being
  # the same knob. A plant taking that declaration away drops the node, which is the evidence that
  # the coverage really moved rather than merely being claimed to.
  #
  # And 863 with F97, the owner's "rotulo pt-BR no lugar, trilha preservada". The internal metric
  # identifier reached him on every label line -- `summary_new_trials` four times in one fragment of
  # the real comparison answer -- and it is now suppressed in favour of the governed label alone.
  # The number is four rather than one because the change has three halves that can each fail on
  # their own: the identifier must LEAVE the body, the governed label must NOT leave with it, and
  # the link to the metric must survive in the claim record filed under the SAME interaction.
  #
  # The fourth node is the one that earns the others. A record assembled beside the claims would
  # satisfy every node above while describing an answer nobody sent, so it compares the record
  # against `answer.claims` themselves; the plant that proves it is a subject diverging between
  # record and response, and it drops the node.
  #
  # Measured and worth stating: the FIRST attempt dropped the subject unconditionally and deleted
  # Android and iOS from the breakdown, because a row label is a subject too. The suppression is
  # therefore keyed on `interpreted.metrics`, and the node that caught it is in test_metrics.py.
  #
  # And 867 with F100, the misattribution. ONE sentence served every governed refusal and it said
  # "a camada de interpretacao recusou". Delivered for OBSERVATIONS_UNAVAILABLE that is FALSE: the
  # query ran, returned, and reported that the requested window sits outside the source's coverage.
  # Interpretation understood the question; nothing there refused. Measured live on the real
  # warehouse, the sender now receives "a camada de execucao recusou" for that path.
  #
  # The layer is read from the governed CODE and never from the message, because
  # AnalyticsReasonCode and InterpretationReasonCode are the two layers' own disjoint vocabularies
  # -- the same discipline the INTENT_AMBIGUOUS branch already followed. A code in neither namespace
  # names NO layer: truthful silence, since guessing is what produced the finding.
  #
  # Four nodes because the easy fix passes three of them. Dropping the layer everywhere would trade
  # a false sentence for a vague one, so one node exercises a refusal that genuinely comes from
  # interpretation and demands it still be named. The plants go both ways and each drops its node.
  #
  # And 870 with F101, which is F100's own neighbour. `_cause_for` had a branch mapping EVERY
  # INTENT_AMBIGUOUS to "ela nomeia mais de um periodo". The reviewer measured that it never
  # executes: with its body replaced by a raise, all 867 nodes still passed. Measuring WHY mattered
  # more than the fact.
  #
  # INTENT_AMBIGUOUS is raised from several places in 003 and EXACTLY ONE is about periods. That
  # one never reaches the branch at all -- model intercepts it at locate_expression and raises
  # ClarificationNeeded(AMBIGUOUS_PERIOD), routed as a clarification, which is the path
  # test_a_question_naming_two_periods_asks_instead_of_blaming_the_model drives. Every other source
  # names no period whatever -- an unresolved slot, a term with several governed candidates -- and
  # measured through the branch, they produced "ela nomeia mais de um periodo... pode reescrever",
  # asking the sender to fix something that is not the problem.
  #
  # F102 took a NUMBER out of this trail and out of two docstrings. They said "three places";
  # measured, there are seven raise sites across six modules, plus one lookalike that is a wording
  # reference and not a refusal. The conclusion did not change -- more non-period sources means the
  # deleted branch would have lied more often -- but a hand-written census is a fact that goes stale
  # the first time somebody adds a raise, and a reader who trusts it concludes the three are covered
  # while more exist. The property is stated without counting, so nothing has to be recounted.
  #
  # So the branch was not merely dead: it was a false sentence waiting for a route, one branch away
  # from the misattribution F100 had just closed. Deleted, and the docstring that cited it as a
  # precedent now states its rule on its own instead of borrowing it from code that is gone.
  #
  # Two plants: re-adding the branch drops the three new nodes; removing the clarification mapping
  # drops the two-period node, which is the evidence that the clarification route -- and not this
  # function -- is what actually serves the period case.
  #
  # And 874 with F103, which added NO production code. The reviewer carried "density measured over
  # one day" as an open item for many cycles and asked, honestly, whether the count that travels in
  # the caveat is taken over the window asked or over one day. Measured: CONTAGEM counts COUNT(*)
  # over the window, SNAPSHOT counts COUNTIF(is_last_covered) over the last covered day -- which is
  # CORRECT, because a snapshot's figure IS one day -- and RAZAO projects no counts at all. And
  # _density_limitations already picked its word to match: "no ultimo dia coberto" for the snapshot,
  # "no periodo" otherwise. So neither number nor sentence was wrong.
  #
  # What was wrong is that NOTHING HELD THEM TOGETHER. The pairing lived in one ternary, and a plant
  # swapping its two branches -- a snapshot's one-day count delivered as "no periodo", which is the
  # sentence-versus-base defect the item suspected -- left all 870 nodes green. Right by accident is
  # the shape this repository keeps paying for, so the four nodes hold the word against the sentence
  # and against the projection.
  #
  # One correction is left inside the new docstring rather than deleted: a draft of it claimed the
  # mirror defect would go unnoticed. It would not -- planting COUNT(*) in the snapshot projection
  # drops two nodes that already existed. Found by running the plant instead of trusting a sentence
  # just written, which is the same discipline the whole day was about.
  #
  # And 879 with F104, which is a delivered figure that was WRONG and said nothing about it. The
  # open item read "the 2 nulls of Cancellations"; measured against the real warehouse, dry run
  # first and every probe under the 200 MB ceiling, it is neither 2 nor the numerator:
  #
  #   numerator IS NULL   : 0
  #   denominator IS NULL : 2810 rows, spanning 374 days, 2025-07-24 to 2026-08-23
  #   none of those 2810 has a null numerator; their numerators sum to 4531
  #
  # The aggregate is SAFE_DIVIDE(SUM(numerator), SUM(denominator)) and SQL's SUM ignores nulls one
  # column at a time, so each of those rows adds to the TOP and nothing to the BOTTOM. Measured for
  # July 2026, the window a person actually asks: 0,19805 % delivered against 0,18566 % for a base
  # without the hole -- about 6,7 % relative, 66 rows of 88271, with no caveat at all.
  #
  # The density guard could not see it and must not be made to: density asks how many rows carried
  # the one column the aggregate sums, and a ratio sums two. F103 pinned that meaning one cycle ago.
  # So the hole gets its own count and its own sentence.
  #
  # Counting it costs NOTHING, measured rather than assumed: the ratio's statement already reads
  # both columns, and the dry run is byte-identical with and without the counts (20008892 either
  # way). NO FIGURE CHANGES -- deciding those numerators should not count is a decision about what
  # the metric means, which belongs to the owner and the source. And the cause is NOT declared,
  # because it was not measured: the sentence says what the hole is, never why.
  #
  # Live on the real warehouse the body now carries "66 das 88271 linhas no periodo estao sem
  # denominador, e o numerador dessas linhas ENTRA na conta enquanto o denominador nao" -- and those
  # counts match the direct probe exactly.
  #
  # And 882 with F106, which the comparison path made visible. F104 and F105 measured the caveat in
  # the body of a ONE-FIGURE answer. A comparison of two periods is a different path, and it is the
  # format the owner approved. Measured there, real model and real warehouse:
  #
  #   - Not renewed (%): 229 das 85084 linhas no periodo estao sem denominador, ...
  #   - Not renewed (%): 279 das 88484 linhas no periodo estao sem denominador, ...
  #
  # BOTH SENTENCES ARE CORRECT -- two windows, two holes, each count its own, and 279 of 88484 is
  # July, matching the direct probe. The caveat reaches the comparison path with no code written for
  # it, which is what keying the projection on the CLASS bought.
  #
  # What was wrong is that a reader cannot tell them apart: two sentences identical in form, one
  # above the other, each saying "no periodo" and neither saying WHICH. Both readings a person would
  # reach are wrong -- that one is a duplicate, or that the pair describes one window. A true
  # sentence a reader cannot attribute is not yet a fact they can use.
  #
  # covered_start and covered_end come back in the SAME statement as the figure, so naming the
  # window costs no query and invents nothing. When the execution reports none the phrase is EMPTY
  # rather than a placeholder: a window that could not be measured is not a window called unknown.
  #
  # Three plants: dropping the window drops two nodes; a window that is always the same string --
  # the subtle one, since every sentence still names A window -- drops the node that renders two;
  # and dropping the counts drops the node that keeps them, in both this class and F104's.
  #
  # And 887 with F107, which is the SECOND time this class appeared in one session. A branch of
  # `_covered_window_of` carried a property in its docstring -- empty rather than a placeholder,
  # because a window that could not be measured is not a window called unknown -- and nothing
  # reached it. Measured: a placeholder put where the empty string is left all 882 nodes green, and
  # a raise in the branch was never raised.
  #
  # F101 was the same shape and closed two cycles earlier. THERE the answer was to delete, because
  # the branch was unreachable AND would have lied if reached. HERE deleting is wrong: covered_start
  # and covered_end are `date | None`, so the branch is required by the type and the property it
  # carries is worth keeping. Four nodes reach it, and with a raise in the body three of them break.
  #
  # THE PREVENTION HALF, and it is measurement rather than a gate. `coverage` is not installed and
  # installing a dependency was not authorised, so a tracer over the suite answered it: of 248 guard
  # branches in the harness, 73 are never entered. Classified, because the raw number overstates:
  #
  #   ESTRUTURAL   TYPE_CHECKING and __main__, never executed by design
  #   RECUSA    26 the body raises -- an untested refusal path, real but NOT this shape
  #   PROPRIEDADE 23 the body RETURNS or ASSIGNS -- this shape exactly
  #
  # NO GATE IS INSTALLED, deliberately. Some of the 23 are unreachable BECAUSE another node
  # guarantees they cannot happen -- `agrees_with_mapping` returns False for a binding with no
  # mapping, and a node asserts every binding has one -- and a gate that called those defects would
  # be noise. The list is handed over for triage instead.
  #
  # One of the 23 was mine: `ClaimTrail.matches` from F97 returns False for an interaction with no
  # record, declares that property in its docstring, and nothing entered it. Closed here, with a
  # plant returning True -- which would report a trail as intact precisely where there is none.
  #
  # And 894 with F109, which took the row-shape branches out of the F108 bucket-B list. The reviewer
  # asked for five; measured, there are SIX -- the object-row path in each of the three readers, the
  # datetime narrowing, the sequence row, and a count column arriving as Decimal or float. The scan
  # confirms it: PROPRIEDADE went from 22 to 16.
  #
  # These six were chosen out of the fifteen because every other one defends against absent
  # configuration, a different channel or malformed input -- conditions somebody notices. An
  # unexpected ROW SHAPE is silent, and this repository has paid for that once: value_of used to
  # int(...) its result, SAFE_DIVIDE answered 0.0911738746690203, the function delivered 0, every
  # percentage came back zero and the suite stayed green because every double served integers.
  #
  # int_of, date_of and value_of are now PUBLIC. A node has to reach those branches by name, and the
  # precedent set by banner_for, arms_for and covered_window_of is that a type-checker rule is not
  # traded for an underscore.
  #
  # The plant worth naming is the datetime one: datetime is a subclass of date, so an
  # isinstance(found, date) check alone would accept a datetime and hand back an object carrying a
  # time and a zone this module never verified. Removing the explicit datetime branch drops exactly
  # that node.
  #
  # No behaviour changed -- the work was to cover, not to redesign, and reaching them found nothing
  # wrong. Ten of bucket B remain on the list, plus the two of bucket C.
  #
  # And 906 with F112, the four bucket-B branches on the DELIVERY path. The criterion differs from
  # F109's six: those were SILENT, which made them urgent. These are not silent -- they decide what
  # a person sees when something is wrong OUTSIDE, and what the code does with them had never been
  # asserted. The scan confirms it: PROPRIEDADE went from 16 to 12.
  #
  # All four plants are the SUBTLE variant, which is the point:
  #   isinstance(message_id, int) weakened to `is None` -> drops the wrong-type node. A string that
  #     looks like a number is what a JSON producer sends, and it would key idempotency under a
  #     value that never equals the integer the rest of the harness compares against.
  #   `cut <= 0` tidied to `cut == -1` -> drops the newline-at-position-zero node. rfind answers 0 as
  #     well as -1 and both mean "no usable break": at 0 the first piece comes out EMPTY, and the Bot
  #     API refuses an empty message.
  #     CORRECTED, and the correction is left here rather than quietly reworded: the first version of
  #     this line said the loop "never shortens the text, which is an answer that never arrives". The
  #     reviewer MEASURED it -- 3 pieces, 1 empty, terminating in 2 turns -- because `lstrip` does
  #     shorten it. The failure is an empty piece, not a hang. The node and its docstring were always
  #     right ("does not produce an empty piece"); the overstatement was mine and it was in THIS
  #     trail, not only in a message. A claim in the trail that measurement does not support is the
  #     class this session has been closing all night, so it is fixed where it was written.
  #   `path.is_file()` relaxed to `exists()` -> drops the directory node. A path that exists and is a
  #     directory is what a mistyped mount produces, and read_text would raise from inside the parser
  #     where the answer is "there is no file here".
  #   the fixture-backend early return removed -> drops its node, and that branch is what keeps a
  #     provider module unimported and a credential unread on a run that never touches a warehouse.
  #
  # split_for_telegram lost its underscore for the reason int_of/date_of/value_of did in F109. No
  # behaviour changed: reaching all four found them already correct.
  #
  # AND THE MARKER GATE EARNED ITS KEEP: the first version of the transport nodes carried no marker,
  # because that file marks per CLASS rather than per module. 906 passed with markers summing to 902
  # and 4 unmarked -- caught before the commit, by the gate whose whole job is that.
  #
  # And 916 with F113, which empties bucket B. The scan closes the arc it opened:
  #
  #   F107 measured   73 unreached branches, 23 of them the "property" shape
  #   F108 triaged    A=5  B=15  C=2, and B was the majority, not A
  #   F109 covered    the six silent row-shape branches      23 -> 16
  #   F110 measured   C into A with the guards named         16 -> 12
  #   F112 covered    the four on the delivery path          16 -> 12
  #   F113 covered    the last five                          12 ->  7
  #
  # WHAT REMAINS IS EXACTLY BUCKET A: seven branches, every one with the guard that makes it
  # unreachable named beside it. Bucket B is empty and bucket C is empty.
  #
  # The four plants here are each the one-sided variant, which is the shape that would survive a
  # careless node: the resolver reading only the CHANNEL and not the identity would hand a binding to
  # anyone who reached the right transport; the delivery reading only the PRESENTATION would send our
  # own content to an address on a transport nobody negotiated. Each drops exactly the node written
  # for the half it dropped.
  #
  # The two factory branches are driven through the PUBLIC path -- what the client receives -- rather
  # than by calling the private methods, so no name was published for a test's convenience.
  #
  # No behaviour changed anywhere in the arc. Every branch reached was already correct, and that is
  # the honest result: the sweep bought coverage, not repairs.
  #
  # THE NUMBER MOVED ON 2026-08-27, AND IT WAS FORTY BEHIND WHEN IT DID. It read 916 against a
  # suite of 956 -- so forty nodes could have vanished and this comparison would still have been
  # satisfied. It is 974 now, MEASURED at the moment of writing by `pytest -q` and not copied
  # from anywhere.
  #
  # 974 is the count of nodes that RUN. It was 955 passing beside 16 skipped: those sixteen cases
  # were the bindings whose SQL reads the source directly, where the projection property does not
  # apply. They no longer skip -- they are no longer GENERATED, and the partition they carried is
  # asserted by a node instead. A skip is a node that did not measure, and sixteen of them sat in
  # the collected total as though they had.
  #
  # AND THE FLOOR IS DECLARED IN TWO PLACES ON PURPOSE, WHICH IS NOT DUPLICATION. This one runs
  # through `tools/local-ci/run_local_ci.py`, which translates these steps and propagates this
  # `env:` block into each of them. The other lives in `tools/git-hooks/pre-push`, which runs on
  # every push without being asked. Two doors that both count is the point; one door believing
  # the other counts is how a push deleting forty nodes stayed green in both.
  # `HARNESS_NODE_FLOOR` USED TO LIVE HERE AND NO LONGER DOES, deliberately. The number is
  # written in `tools/git-hooks/pre-push` alone and this workflow ASKS for it, because two
  # literals in two doors with nothing keeping them equal is a floor that can be raised in one
  # place and stay satisfied in the other. The reasoning about WHY it is a floor rather than an
  # equality is above and is unchanged.

jobs:
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/telegram-bot
    steps:
      # No `fetch-depth: 0`. Two nodes shell out to git -- `test_every_run_artifact_is_ignored` and
      # `test_no_run_artifact_is_tracked_today` -- and both need a real repository, which `checkout`
      # provides at any depth. No node compares against a base ref, so full history would buy
      # nothing here and claiming otherwise would be a reason that does not apply.
      - uses: actions/checkout@v4
      - name: The two git-shelling nodes need a real repository, so prove there is one
        working-directory: .
        run: |
          echo "scope evidence: inside a work tree = $(git rev-parse --is-inside-work-tree)"
          echo "scope evidence: tracked files under the harness = $(git ls-files apps/telegram-bot | wc -l)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Resolution 2. The virtual environment lands at the repository root because that is where
      # this directory's `pyright` config already looks, and resolution 1 decides what goes in it.
      - name: Build the environment the harness config already points at
        working-directory: .
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # Upstream first: semantic_catalog <- analytics_query <- analytics_interaction <-
          # channel_integration. The install order is what supplies each path dependency.
          .venv/bin/python -m pip install -e "packages/semantic_catalog[dev]"
          .venv/bin/python -m pip install -e "packages/analytics_query[dev]"
          .venv/bin/python -m pip install -e "packages/analytics_interaction[dev]"
          .venv/bin/python -m pip install -e "packages/channel_integration[dev]"
          # 2026-09-01, medido no runner: o harness passou a importar mais tres pacotes desde
          # que a resolucao 1 foi escrita -- deliver_daily_report/run_daily/write_schedule
          # importam daily_reporting (14 imports), e a demo alcanca anomaly_investigation (3)
          # e insights_prioritisation (2). Sem eles o pyright deu 170 reportMissingImports em
          # cascata sobre os MESMOS 53 arquivos que respondem zero localmente.
          # A ordem e a das dependencias locais: daily_reporting exige anomaly==0.1.0 e o
          # runner nao tem PyPI para isso -- o pacote local instalado antes satisfaz o pino.
          # `OD-76` (2026-09-01): o harness passou a importar conversation_context -- a
          # memoria da 011 e a casa da rodada de clarificacao.
          .venv/bin/python -m pip install -e "packages/conversation_context[dev]"
          .venv/bin/python -m pip install -e "packages/anomaly_investigation[dev]"
          .venv/bin/python -m pip install -e "packages/insights_prioritisation[dev]"
          # daily_reporting pina a cadeia 005..007 inteira; proactive vem antes dele.
          .venv/bin/python -m pip install -e "packages/proactive_distribution[dev]"
          .venv/bin/python -m pip install -e "packages/daily_reporting[dev]"
          echo "scope evidence: interpreter for every gate below"
          .venv/bin/python -V

      # Resolution 1, first and on its own. If this directory imports something the four packages
      # pin nowhere, that must read here -- naming the module -- and not three steps later as a
      # gate that looks broken.
      - name: Every third-party import is pinned by a package the harness exercises
        run: ../../.venv/bin/python -m pytest tests/test_dependencies.py -q -rs --strict-markers

      - name: Format check, with the file count ruff walked
        run: |
          out=$(../../.venv/bin/python -m ruff format --check . 2>&1) && status=0 || status=$?
          echo "$out"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if ! echo "$out" | grep -qE '^[0-9]+ files? already formatted'; then
            echo "gate failed: ruff reported no file count, so it walked nothing recognisable"
            exit 1
          fi
          seen=$(echo "$out" | grep -oE '^[0-9]+' | head -1)
          echo "scope evidence: ruff format walked $seen files"
          if [ "$seen" -lt 1 ]; then echo "gate failed: zero files"; exit 1; fi

      - name: Lint, with the file count ruff walked
        run: |
          seen=$(../../.venv/bin/python -m ruff check . --show-files | wc -l)
          echo "scope evidence: ruff check would walk $seen files"
          if [ "$seen" -lt 1 ]; then echo "gate failed: zero files"; exit 1; fi
          ../../.venv/bin/python -m ruff check .

      - name: Strict type check, with the file count pyright analysed
        run: |
          # F82. This step used to capture pyright's output, parse it inside a command substitution
          # and judge the two numbers with `if [ ... ]`. That construction is green when pyright
          # produces nothing parsable, and the reason is worth writing down because it is not
          # obvious: `read` on empty input returns 0, so `-e` never fires; the two variables end up
          # empty; `[ "" -lt 1 ]` then fails with status 2 rather than answering the question -- and
          # **a test that fails inside an `if` condition does not trigger `set -e`**, so the `then`
          # branch is skipped, the second `if` does the same, and the step's last command exits 0.
          #
          # It is reachable rather than theoretical: `pyright` from PyPI declares `nodeenv`, and the
          # `nodejs` extra that would ship a Node binary is not installed, so on a cold runner it
          # downloads Node on first use. A failed download prints a message and no JSON.
          #
          # So there is no capture and no `if` here any more. One pipeline, and the **parse is the
          # verdict**: `json.load` on anything that is not pyright's report raises, which exits
          # non-zero as the step's own last command. `sys.exit(str)` does the same for zero files
          # analysed and for any strict error. Nothing swallows an exit code, and `pipefail` carries
          # a pyright that died before writing.
          ../../.venv/bin/python -m pyright --outputjson | ../../.venv/bin/python -c "import json, sys; r = json.load(sys.stdin); s = r['summary']; a, e = s['filesAnalyzed'], s['errorCount']; print(f'scope evidence: pyright analysed {a} files, {e} errors'); [print(f\"  {d['file']}:{d['range']['start']['line'] + 1} - {d.get('rule', '?')}: {d['message'].splitlines()[0][:140]}\") for d in r.get('generalDiagnostics', [])[:60] if d['severity'] == 'error']; sys.exit('gate failed: pyright analysed zero files, so venvPath did not resolve' if a < 1 else (f'gate failed: {e} strict errors' if e else 0))"

      - name: Tests, with the node count and zero tolerance for a node that is not counted
        run: |
          out=$(../../.venv/bin/python -m pytest -q -rs --strict-markers 2>&1) && status=0 || status=$?
          echo "$out"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          for word in xfailed xpassed deselected failed error; do
            if echo "$out" | grep -qE "[0-9]+ $word"; then
              echo "gate failed: the summary reports $word, and a node that is not counted is a gate that warns"
              exit 1
            fi
          done
          # SKIPS: tolerancia zero, com UMA particao afirmada -- e a particao NAO e uma lista de
          # CAMINHOS. Ate 2026-09-06 estas linhas nomeavam dois arquivos de teste literalmente.
          # Em 2026-09-04 um TERCEIRO arquivo passou a pular pelo motivo que a lista JA tolerava,
          # e o portao ficou vermelho pelo ENDERECO, nao pelo motivo. Acrescentar o terceiro
          # caminho compraria umas oito semanas. E o `F136`, a quatro linhas do `--floor-for`
          # que existe exatamente para curar isso.
          #
          # O que este workflow declara no topo e uma propriedade do RUNNER: sem credencial
          # Google e sem `.env`, por construcao. O unico campo de uma linha SKIPPED que se
          # compara com uma afirmacao sobre o AMBIENTE e o MOTIVO.
          #
          # O conjunto de motivos -- e o JUIZO sobre eles -- e pedido ao push hook, a mesma porta
          # unica de onde o piso vem logo abaixo. O juizo mora la e nao aqui: publicar so a lista
          # e reescrever a comparacao em cada porta seriam duas copias da mesma regra, que e o
          # mesmo defeito um nivel acima. O casamento e ancorado no PRIMEIRO caractere do motivo,
          # entao mencionar uma frase tolerada no meio de uma frase nao compra nada.
          unexplained=$(echo "$out" | bash ../../tools/git-hooks/pre-push --unexplained-skips apps/telegram-bot) && judged=0 || judged=$?
          if [ "$judged" -ne 0 ]; then
            echo "gate failed: the push hook could not judge this suite's skips, so the partition was not applied"
            exit 1
          fi
          if [ -n "$unexplained" ]; then
            echo "gate failed: a node skipped for a reason outside the declared no-secrets partition:"
            echo "$unexplained"
            echo "the reasons this partition declares, in tools/git-hooks/pre-push:"
            bash ../../tools/git-hooks/pre-push --tolerated-skip-reasons apps/telegram-bot
            exit 1
          fi
          skipped=$(echo "$out" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+' | head -1)
          echo "scope evidence: ${skipped:-0} skips, all inside the declared no-secrets partition (credential + .env)"
          passed=$(echo "$out" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | head -1)
          # THE FLOOR IS ASKED OF THE PUSH HOOK, WHICH IS THE ONE PLACE IT IS WRITTEN.
          #
          # It used to be an `env:` literal here AND a literal in `tools/git-hooks/pre-push`, with
          # nothing keeping the two equal -- two doors, two numbers, and a floor raised in one of
          # them silently left the other satisfied. That is the `F136` shape: a declaration living
          # in a place that ages.
          #
          # A floor that cannot be read is a FAILURE and never an absence of one, the same rule
          # this file already applies to a node count: "did not measure" is never "passed".
          floor=$(bash ../../tools/git-hooks/pre-push --floor-for apps/telegram-bot)
          case "$floor" in
            ''|*[!0-9]*)
              echo "gate failed: the push hook did not print a floor for this suite, so the floor was not applied"
              exit 1
              ;;
          esac
          echo "scope evidence: $passed nodes passed, floor is $floor"
          if [ "$passed" -lt "$floor" ]; then
            echo "gate failed: below the floor, so a node vanished"
            exit 1
          fi

      # The four markers are the whole suite, and the residue is the point: a node with no marker
      # is a node nobody classified, and `--strict-markers` cannot see that on its own.
      - name: Markers account for every node, with no residue
        run: |
          total=$(../../.venv/bin/python -m pytest --collect-only -q --strict-markers | grep -c '::')
          sum=0
          for marker in unit integration adversarial security; do
            n=$(../../.venv/bin/python -m pytest --collect-only -q --strict-markers -m "$marker" | grep -c '::' || true)
            echo "scope evidence: $marker = $n"
            sum=$((sum + n))
          done
          unmarked=$(../../.venv/bin/python -m pytest --collect-only -q --strict-markers \
            -m 'not unit and not integration and not adversarial and not security' | grep -c '::' || true)
          echo "scope evidence: total = $total, markers sum = $sum, unmarked = $unmarked"
          if [ "$sum" -ne "$total" ]; then echo "gate failed: marker residue"; exit 1; fi
          if [ "$unmarked" -ne 0 ]; then echo "gate failed: $unmarked node(s) carry no marker"; exit 1; fi
