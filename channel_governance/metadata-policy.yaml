# Governed operational metadata and retention rule — D-29. Owned by data
# governance, with privacy sign-off.
#
# EMPTY AND UNAPPROVED BY DESIGN.
#
# Required together: version, effective_from, an `approval` mapping,
# permitted_fields, retention_days and carries_no_analytical_value (which must be
# literally true — a policy that does not assert it does not resolve).
#
# While this file declares no instance, NOTHING PERSISTS. Not "nothing important" —
# nothing. The measured persisted-record count is zero (SC-036), and this feature
# owns no store for one to accumulate in (FR-075).
#
# The in-memory idempotency structure is NOT persistence: it is process-local,
# window-bounded, and carries no question text, answer content, value or personal
# data. It does not become permissible by this document and does not wait for it.
#
# DO NOT INVENT A FIELD LIST OR A RETENTION PERIOD. "Minimal operational metadata"
# is not a specification until someone names the fields and the period, and naming
# them here would be inventing a privacy decision.

schema_version: 1
kind: channel_metadata_policy

# A list of versioned instances, each with version, effective_from, an optional
# effective_to, an `approval` mapping, and the three governed fields.
instances: []
