# Governed channel identity-binding rule — D-27. Owned by security and IAM, with
# data-governance sign-off.
#
# EMPTY AND UNAPPROVED BY DESIGN.
#
# Required together: version, effective_from, an `approval` mapping, registry_ref,
# revocation_rule, ambiguity_rule and expiry_rule.
#
# THIS FILE CARRIES NO BINDINGS AND NO IDENTITIES. `registry_ref` names where the
# bindings live; it is not a list of them. A rule document carrying phone numbers,
# member ids or chat ids would put personal data into a governed content file in
# version control, which FR-077 forbids outright.
#
# While this file declares no instance, no external identity resolves and every
# inbound message refuses with CHANNEL_IDENTITY_POLICY_UNRESOLVABLE before any
# interpretation cost is incurred. An unmapped identity refuses with
# CHANNEL_IDENTITY_UNMAPPED, and the two are indistinguishable to a sender.
#
# DO NOT INVENT A BINDING, A REGISTRY, A REVOCATION RULE OR AN AMBIGUITY RULE.
# Resolving an identity is deciding who is asking; a transport may not decide that.

schema_version: 1
kind: channel_identity_binding_rule

# A list of versioned instances, each with version, effective_from, an optional
# effective_to, an `approval` mapping, and the four rule fields.
instances: []
